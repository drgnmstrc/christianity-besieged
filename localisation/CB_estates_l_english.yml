l_english:
 estate_gangans: "Gangans"
 estate_gangans_desc: "Gangan is an expression for thanks in the Taa-!Kwi world, and so this expression of thanks spread throughout the Q'a Num religious world, becoming not only an expression of thanks but also an identity, one who is religiously adept and brings power to the many Gods."
 estate_kurudiju: "Kurudiju"
 estate_kurudiju_desc: "The Kurudiju are an empowered class of tribalistic warriors whose rise to power coincided with their great devotion in Saa Dzahi's conflicts against non-Q'a Numi. Finding their origins mostly in the !Kung tribes converted to the faith, these warriors have since spread far and wide across the Q'a Num world, seeking favor, respect, and to put Kurudi philosophy into practice."
 estate_qhaalanmaa: "!Qhaa|ànmaà"
 estate_qhaalanmaa_desc: "!Qhaa|ànmaà is a variant of a formal expression in the Q'a Num trading world that was popularized in the early years of the ||qu|Vum Kx'ai to increase cooperation between the disparate tribes. It means 'Give' in the Taa, Ju'|hoan, and Khoekhoe languages, and then 'you' in Taa. This form of expression was utilized when giving a trading partner your end of a trade. The trader says give in any Taa-!Kwi, then !Kung, and finally Khoe language, and then 'you' would be said in the person's native language. The expression as a form of identity for the merchant class began throughout the late 14th century onwards, as the merchants of the Q'a Num world gained more power."
 estate_druids: "Druids"
