l_english: 
 cambridge_ideas: "Dimissi Ideas"
 cambridge_ideas_start: "Dimissi Traditions"
 cambridge_ideas_bonus: "Dimissi Ideas"
 church_of_cambridge: "Legacy of the Resistance"
 church_of_cambridge_desc: "The Ut Dimissi can find its origins in the Norse Hjallaw, which started in 1028 when the military dictatorship of Vitalianus, which brought widespread corruption to Brittania, found itself laughably incapable of preventing the Hjallish King from taking over the region - sacking Londonium to little resistance. Most Roman communities (especially in central and northern Brittania) were absolutely decimated as the Hjallaw attracted the settlement of thousands of Norse communities who conquered and displaced the Britons. But a heroic band of freemen, our ancestors, protected the Roman communities in the region around Durolipons, frequently raiding Londonium and making the entire region unviable for Norse settlement while bringing in refugees who overwhelmingly saw this a miracle of God and converted to the true faith. Without their sacrifices, the Christians of Brittania would have been forced asunder."
 order_of_god: "Liberators of Londinium"
 order_of_god_desc: "In 1055, the army of the Christian freemen, known at the time as the Dimissi Praesidium Roma Miraculum, or Protectors of the Forgiven Miracle in Rome, liberated Londinium and brought it under the rule of the Societas Piorum. The liberation was done in reaction to the landing of Artour, a claimant who had fled the island as a toddler and whose family and person would be forgiven in Londinium upon his return. While many claim that Artour never officially renounced the Roman faiths, and still paid tribute to Jupiter, the Emperors and Sol Invictus, the Societas Piorum was never completely absolished and Christianity flourished under Roman rule for the first time in history, leaving most to accept that Artor accepted Jesus personally and laid the ground for the true faith to flourish in Brittania and Soissons."
 holy_missionaries: "Legitimacy of the Societas Piorum"
 holy_missionaries_desc: "Beginning as a small council of theologically astude veterans of the Christian society within the Hjallaw, the Societas Piorum briefly ruled as the governing body of Londinium before submerging into the background as a tolerated though rapidly growing representative body that legitimized Christian worship under the Roman system under Artour. The Piorum held the loyalty of the Dimissi, whose veterancy and expertise in local warfare was vital to Artor's reconquest efforts against the petty Norse kings that were consolidating power in the wake of the Hjallaw.\n Despite the failures that occured in the rule of the kings immediately before and after Artor, the Piorum would survive the reign of Artor's successor (believed by the Societas to be Constantine IV). The Piorum also helped provide financial aid to emergent Christian groups in Soissons during the reign of Riothamus, who united the entire region after the reign of Constantine IV and the death of Vitalianus, who had fled to the Soissons and remained in power."
 survival_of_message: "Survival of Christ's Message"
 survival_of_message_desc: "It is of paramount importance that we and our Christian allies endure to continue teaching God's message, so that mortals can still seek salvation before the Apocalypse. We will fight until the bitter end for it."
 christian_flexibility: "Christian Flexibility"
 christian_flexibility_desc: "While it was Riothemus' standards of worship that brought the Christians of Brittania together, we were happy to oblige to the standards of Lothar's kingdom in the name of unity. Our fear of God is greater than our care for semantics."
 christ_across_world: "Our Divine Chance"
 christ_across_world_desc: "We once thought we were at the edge of the world on these Isles, but we were brought here divinely, for it has given us the unique opportunity to be able to send our men far and wide across the world. From here we can proliferate our message far beyond the land. While our neighbors might have already thoroughly discarded the word of God, there is still hope yet for those souls beyond the pale."
 expansion_missionaries_desc: "But if we truly are the messengers of God, it is of utmost importance that we keep our missionaries our highest investment."
 expansion_missionaries: "Expansion of Missionary Class"
 aldens_successors: "Successors of King Alden I"
 aldens_successors_desc: "We are the successors of King Alden I of the Franks, chosen of the sacred groves, who founded Aldenburg in his own name. We held the line against the Christian heathens and maintained the worship of his Gods here."
 oldenburgian_ideas: "Aldennan Ideas"
 oldenburgian_ideas_start: "Aldenaan Traditions"
 oldenburgian_ideas_bonus: "Aldennan Ambitions"
 oldenburg_lanes: "Protective Shipping Lanes"
 oldenburg_lanes_desc: "It's impossible to maintain a successful North Sea trading fleet without a heavy investment into its defense. Anything else, the Norse will take."
 gate_of_germania: "The Gate of Germania"
 gate_of_germania_desc: "We are the Gate of Germania to the great beyond. It is important to maintain both our position in Germania and our expansion beyond it."
 faraway_ideals: "Faraway Ideas"
 faraway_ideals_desc: "We've learned of many queer customs, peoples, and things on our journeys, and our people return from long journeys with completely new perspectives."
 coexisting_electorkings_desc: "We must always remember to maintain our relationships with our fellow Elector Kings, for our bond is the lifeblood of Germania."
 coexisting_electorkings: "Coexisting with the Elector-Kings"
 developing_abroad_desc: "The North Sea is a crowded, war-torn place. Quaint land exists all across this vast world just waiting for those adventerous enough to take it."
 developing_abroad: "Developing Abroad"
 ancient_oldenburg: "Aldenburg's Ancient Court"
 ancient_oldenburg_desc: "Our court is ancient and large, and service in it is a prestigous position that is highly sought after."
 gepid_ideas: "Gepid Ideas"
 gepid_ideas_start: "The Privilege of Generalship"
 gepid_ideas_bonus: "Gepid Ideas"
 guardians_of_alps: "Guardians of the Alps"
 guardians_of_alps_desc: "Since the fall of Lombardy, we have become the wall that separates the fragile political network of Germania from the heretics beyond. We are beset by the Turk, the Slav, and the Nord, but we will overcome them."
 constant_recovery: "Gepidan Resilience"
 constant_recovery_desc: "We have becomes masters of recovery, standing back up and recovering from every defeat and every setback, and coming out stronger."
 carving_gepidia: "Carving our State"
 carving_gepidia_desc: "We must do our best to carve for ourselves a great scale of land for Gepida, and Germanify them immediately."
 gepid_superiority: "Seniority of Superiority"
 gepid_superiority_desc: "Laziness and wastefulness is surprisingly absent in Gepidan higher court, and this attitude carries below. To distinguish yourself amongst the nobility and military you must earn it."
 mountain_infrastructure: "Gepida's Infrastructure"
 mountain_infrastructure_desc: "The mountainous nature of our lands requires creative thinking in how to develop it to the standards of more naturally habitable regions."
 gepid_drilling: "Drilling in Gepida"
 gepid_drilling_desc: "If there's anything Gepida is known for, its that our generals are some of the most focused, efficient army drillers in the world."
 gepids_historied_warriors: "On the Shoulders of Giants"
 gepids_historied_warriors_desc: "We have a long history of great generals, soldiers, and heroes to look back on as a nation. It is our greatest pride."
 gerlandic_ideas: "Rodrizy Ideas"
 gerlandic_ideas_start: "Rodrizy Traditions"
 gerlandic_ideas_bonus: "Rodrizy Ambitions"
 redirecting_germany: "Borne In Conflict"
 redirecting_germany_desc: "The foundational roots of our nation goes back many centuries, when the status quo of Veleti and Pomeranian dominance over the southwestern Baltic coast was brought to a steady decline by an influx of Norse raiders and refugees along the coast. Concentrated in well defended coastal holdfasts, the most successful of these militaristic communities would often fight in other wars as sellswords. While under the rule of other Norse dynasties for brief periods, the Kytlingas and the Jomsvikings they led would ultimately bring rise to the modern Rodrija."
 providing_holy_tribute: "Providing Holy Tribute"
 providing_holy_tribute_desc: "Creating domains out of the remains of heretic kings as tribute to Rod is instrumental to receiving His divine favor. We must extract every taxable cent from these domains and redirect them towards missionary services and military."
 subduing_the_slavs_desc: "The slavic tribes for a time represented a real threat to Norse expansion until the Mongol invasions. Now it's simply a matter of cleaning up."
 subduing_the_slavs: "Subduing the Slavs"
 nordkrieg: "Nordkrieg"
 nordkrieg_desc: "We will show them our Norse-Germanic might!"
 frontier_fervor: "Fervor on the frontier"
 frontier_fervor_desc: "Our people are migratory, excited to start new lives on our frontiers, and spread our culture and faith."
 gerlands_vast_peoples_desc: "Despite our cultural synthesis of Norse and Germanic culture, we still are a melting pot of many different cultures. We have to accept a broader view of what it means to be a Gerlander."
 gerlands_vast_peoples: "Gerlands Vast Peoples"
 visions_of_nordreich: "Visions of the Nordreich"
 visions_of_nordreich_desc: "Die Thiota Reichien is the predecessor to a long line of Gerlandic rule over the Germans. Our time has come."
 anglic_ideas: "Anglic Ideas"
 anglic_ideas_start: "Children of the Angles"
 anglic_ideas_bonus: "Anglic Ideas"
 anglo_saxon_wars: "The Anglo-Saxon Wars"
 anglo_saxon_wars_desc: "The Angles and the Saxons never truly coexisted on Brittania. Before Die Thiota Reichien and the Christenization of the Saxons, there was barely a difference, but the Saxons have fallen from grace and have been our scourge ever since. Our experienced army reflects this history of war."
 anglic_north_trade: "The North Sea Trade"
 anglic_north_trade_desc: "The North Sea trade has never been so lucrative. It would be very unwise not to invest in this honeypot."
 favor_tourneys_desc: "Pious folk from all over Anglia fight in favor tourneys for the favor of the Gods, a unique tradition of our nation. It keeps our best soldiers sharp and provides entertainment to the commoners."
 favor_tourneys: "Favor Tourneys"
 anglic_newworld_exodus: "The New World Exodus"
 anglic_newworld_exodus_desc: "The people of Anglia are keen to explore this new world that has been discovered and make sure its future sees worship of the true gods. We have invested greatly in seeing to develop a civil apparatus to see our pilgrims safetly."
 threat_of_germania: "The Threat of Germania"
 threat_of_germania_desc: "We must be ever wary of the Germanian threat. They have taken the Gods and tried to cage them in this mortal plane, but beyond it their souls are likely being tormented in retribution. It is paramount that they do not spread their false gospel upon our island."
 securing_anglias_hinterlands: "Securing the Hinterlands"
 securing_anglias_hinterlands_desc: "As we secure our presence not only on the Isles but in the lands beyond, it is important that we maintain our authority in order to allow our people to flourish. Caving in to others will bring about the death of what we've created."
 the_anglic_absolute: "The Anglic Absolutes"
 the_anglic_absolute_desc: "There are many absolutes about Anglia. We are the rightful Kings of Brittavia. We are the greatest of the Norsemen, having fought a thousand foes for our stake here, against greater odds than any of the great settler kings. And it is our destiny to rule."
 hjallic_ideas: "Hjallic Ideas"
 hjallic_ideas_start: "Norðrvíkingr Legacy"
 hjallic_ideas_bonus: "Hjallic Ideas"
 little_leftfor_us: "Little Left in Europe"
 little_leftfor_us_desc: "As power consolidates itself in Europe, it grows harder and harder to find land to plunder and conquer. We must find new lands if we want to maintain our traditions."
 fortifying_northsea_barges: "Fortifying the North Sea Barges"
 fortifying_northsea_barges_desc: "If we want to maintain our infamy in the North Sea, it must be a great investment of ours."
 closing_the_lanes: "Closing the Lanes"
 closing_the_lanes_desc: "The art of naval warfare has become second nature to us. No aggressor will ever reach the islands."
 ruthless_punity: "Ruthless Punity"
 ruthless_punity_desc: "Our administrators and soldiers show ruthless punity to heretics, and instrument the swift breakdown of their political institutions upon conquest."
 hjallic_north_fleet: "The Hjallic North Fleet"
 hjallic_north_fleet_desc: "Even in times of peace, the Hjallic North Fleet is constantly showing its strength."
 expanding_settler_opportunities: "Expanding Settler Opportunities"
 expanding_settler_opportunities_desc: "Our future lies in our colonial ventures. We have undergone massive investments into our colonial program."
 hjallic_markets: "New Markets"
 hjallic_markets_desc: "As we expand the Norðrvíkingr across Earth, we must invest in our merchant class to better take advantage of it."
 great_moravian_ideas: "Grand Moravan Ideas"
 great_moravian_ideas_start: "Grand Moravan Traditions"
 great_moravian_ideas_bonus: "Grand Moravan Ideas"
 incorporating_carpathians: "Incorporating the Juzna"
 incorporating_carpathians_desc: "Throughout the 12th-14th centuries, waves of migration of Juzna - Slavic migrants, fled from their diverse origins in the breadth of the Turkic-ruled Balkans, mostly migrating north into the Juzna Voivoides of Hradnihrade and Lenzia, but many went further north into our lands, especially Pest and Szolnok. It was not a planned or clean process, and we still struggle to this day attempting to monitor the economic activities of the commoners and taxing them. As time passes, however, more of them enter our ledgers."
 friends_with_heretics: "Friends with Heretics"
 friends_with_heretics_desc: "We exist in a land beset by heretics all around, and there are simply not enough Slavic allies to be had. We can't be picky with the friends we make."
 moravian_ingenuity: "Moravan Ingenuity"
 moravian_ingenuity_desc: "Centuries of political stability in the Moravan heartland has fostered a breeding ground for innovative thought, and our architecture is well developed."
 glorious_great_guard: "The Car Guard"
 glorious_great_guard_desc: "The elite guard that defend the Car are a prestigous organization, whose discipline and virtue is an inspiration to all soldiers of Grand Morava."
 new_moravian_offices: "Expanding Grand Morava's Offices"
 new_moravian_offices_desc: "We have the infrastructure and bureaucracy to be able to sustain greater diplomatic activity, and must make these moves to better reflect our status as an Empire."
 bureaucratic_bottleneck: "A Moravan Government"
 bureaucratic_bottleneck_desc: "There's a saying in Europe that when something is excessively complicated, it is Moravan in nature. Well, the Moravan bureaucracy is advantageous to our coffers, one way being our tax collectors oft compete for rank and salary by tiniest of margins, and their competitive nature keeps us rich."
 mediterranean_ideas: "Mediterranean Ideas"
 mediterranean_ideas_start: "Mediterranean Traditions"
 mediterranean_ideas_bonus: "Mediterranean Ideas"
 conquerors_farwest: "Conquerors of the Roman Seas"
 conquerors_farwest_desc: "We didn't conquer Aybirea and Sicily by force of might alone. Our mighty war fleets prevented important crossings, sank important vessels, and providing a naval burden too great for the crumbling Roman Empire to bear."
 ears_in_mediterranean: "Ears in the Mediterranean"
 ears_in_mediterranean_desc: "We have hundreds of eyes and ears all over the Mediterranean, and it is rarely an issue for us to get the information we need."
 andalusian_missionary_fleet: "Missionary Fleet"
 andalusian_missionary_fleet_desc: "Our burgeoning fleet of missionaries is instrumental to the salvation of savages all across the world."
 rums_champions: "Champions of the House of God"
 rums_champions_desc: "We are the champions of the House of God. We spread his holy word, and consequently have gained his favor."
 pleading_to_barbarians: "Pleading to Savages"
 pleading_to_barbarians_desc: "It is a humble and noble thing to plead to the savage to save their souls, to hope they learn to worship Allah and save their societies from destruction."
 lessons_of_mediterranean: "Lessons of the Mediterranean"
 lessons_of_mediterranean_desc: "We have learned many lessons from centuries trading in the Mediterranean, and our ships hold great influence in these waters."
 growing_andalusian_merchants: "Growing Merchant Class"
 growing_andalusian_merchants_desc: "It is only natural for us to grow our merchant class to reflect our greater scope of influence across the world."
 settler_ideas: "Settler Ideas"
 settler_ideas_start: "Vultures of the Khan"
 settler_ideas_bonus: "Settler Ideas"
 norse_settler_optimism: "Settler Optimism"
 norse_settler_optimism_desc: "Our people are excited and invigorated to build a new life for themselves and their families here."
 learning_from_the_khans: "Learning from the Khans"
 learning_from_the_khans_desc: "We should learn from the Khans, they did build a massive empire after all."
 connecting_the_norse_east: "Connecting the East"
 connecting_the_norse_east_desc: "The entire Norse world would benefit from a Nordic bridge between the North Sea and the Black Sea. We should carve out that bridge."
 norse_pushing_against_tribes: "Pushing the Tribes"
 norse_pushing_against_tribes_desc: "We need to expand into the tribes as quickly as possible so as to maintain our image as an idea place to settle."
 norse_talent_from_the_west: "Talent from the West"
 norse_talent_from_the_west_desc: "We are a talent sink for our eastern Norse neighbors. All their best are leaving for glory here."
 ostization: "Ostization"
 ostization_desc: "We need to adopt aggressive Ostization policies to assimilate the Tartars."
 norse_birth_by_fire: "Born in Fire"
 norse_birth_by_fire_desc: "We were founded on conquest and dreams of glory, and our leadership has a long history of warfare, which has become the most important aspect of court."
 hellenic_ideas: "Hellenic Ideas"
 hellenic_ideas_start: "Ancient Bureaucracy"
 hellenic_ideas_bonus: "Philosophical Legacy"
 greek_diplomacy: "Hellenic Diplomacy"
 greek_diplomacy_desc: "Hellenic diplomacy involves a lot of listening, though not necessarily when people want to be heard."
 ancient_traditions: "Ancient Traditions"
 ancient_traditions_desc: "We have ancient Hellenic traditions, and our continued success is testament to the strength of our systems."
 the_people_of_the_aegean: "People of the Aegean"
 the_people_of_the_aegean_desc: "We are the people of the Aegean, and these are our seas."
 rule_by_might: "Rule by Might"
 rule_by_might_desc: "The foundational philosophy of civilization."
 greek_ledgers: "Hellenic Ledgers"
 greek_ledgers_desc: "Our robust and extensive language and documentation infrastructure means that we never forget a thing, and never take a step back on the road of progress."
 social_traditions: "Social Traditions"
 social_traditions_desc: "The Hellenic people have very social traditions, and eloquence in court is an expectation of Greek rulers of all kinds."
 legacy_of_salamis_desc: "At the Battle of Salamis, we annihilated a Persian naval host over thrice our size. Our understanding and mastery of our seas makes naval invasion nigh impossible for others."
 legacy_of_salamis: "Legacy of Salamis"
 roman_successor_ideas: "Roman Successor Ideas"
 roman_successor_ideas_start: "Dreams of Reconquest"
 roman_successor_ideas_bonus: "Roman Successor Ideas"
 the_little_romans: "The 'Little Romans'"
 the_little_romans_desc: "In the world of diplomacy, others are usually pretty friendly with us. Unfortunately, it's usually in a very patronizing way. We can use this to our advantage, however."
 legacy_of_innovation: "Legacy of Innovation"
 legacy_of_innovation_desc: "We have a legacy as being innovators, and there's no reason not to continue these traditions away from Rome."
 asserting_the_old_pantheon: "Asserting the Old Pantheon"
 asserting_the_old_pantheon_desc: "We have asserted the place of the ancient Roman pantheon as the legitimate faith of the courts. We have always ruled by the will of Jupiter."
 legacy_of_the_cunctator: "Legacy of the Cunctator"
 legacy_of_the_cunctator_desc: "When Hannibal ravaged Italy, the Cunctator held back and let them bleed out slowly. In our position, we need to learn from his wisdom."
 these_roads_tho: "Europe's Architects"
 these_roads_tho_desc: "Who built the roads that everyone uses today, that still hold? That's right, we did. While others may be able to rule our architecture by might, they can't learn the administrative ingenuity that is natural to us."
 reromanization: "Reromanization"
 reromanization_desc: "It's not hard to reassert Roman culture, it's familiar and uniform. Once Roman rule is reasserted, the people are ready to return to an era of prosperity and peace."
 power_unto_this_ceaser: "Power Unto Caeser"
 power_unto_this_ceaser_desc: "We have a natural propensity to absolutism despite our republic origins. Sometimes it takes a tyrant to really get things done."
 house_of_god_ideas: "House of God Ideas"
 house_of_god_ideas_start: "The House of God"
 house_of_god_ideas_bonus: "House of God Ideas"
 caliph_dues: "Caliph Dues"
 caliph_dues_desc: "We make many a coin from the religious tributes paid to us across the Alsabab l-'Adl world."
 power_of_the_house: "Power of the House"
 power_of_the_house_desc: "The House of God has authority like none other in this world, and we have a special right to rule."
 tributes_of_rum: "Tributes of Rum"
 tributes_of_rum_desc: "Our tributes are always overflowing with piety yet seemingly strapped for cash."
 alsabab_style: "The Alsabab Style"
 alsabab_style_desc: "The unique style of religious artwork in the mosques of Rome is truly like nothing else in the world. The Renaissance has taken the best of all forms across the world, and we have shaped it in Allah's image."
 reuniting_the_alsababi: "Reuniting the Faithful"
 reuniting_the_alsababi_desc: "The reunification of the Caliphate is long overdue."
 rum_euro_jihad: "A Jihad for Europe"
 rum_euro_jihad_desc: "The continent of Europe is still a mostly barbaric place, with only old Rome's heartlands devoted to Allah. It is far past time we put down their squabbling degenerasies of faiths and brought peace to the land."
 ordaining_new_infrastructure: "Ordaining New Infrastructure"
 ordaining_new_infrastructure_desc: "It isn't uncommon for our architects to get assistance from other Alsababi nations these days, it really seems the faithful are doing everything they can to remain on our good side."
 phrygian_ideas: "Phrygian Ideas"
 phrygian_ideas_start: "Phrygian Traditions"
 phrygian_ideas_bonus: "Phrygian Ideas"
 anatolian_legacy: "Anatolian Legacy"
 anatolian_legacy_desc: "Anatolia has a long history of war, one that has forced its occupants to become powerful or falter."
 phyrgias_revenge: "Phrygian Irredentism"
 phyrgias_revenge_desc: "Phrygia's peoples have maintained a proud history that has survived countless invasions. Brief eras of Phrygian independence would revitalize their culture and worship of Cybele, before foreign rulers would make every effort to destroy them. From Alexander's initial conquest to defeats in the Pontic Civil War and Phrygian War reducing Phyrgia to the insignificant city-states of Dorylaion and Synnada by the 5th century, the Phrygian people have been subject to constant injustice. By the 15th century, the newly united Phrygian peoples began to come together more in enthusiasm for the military, being sung tunes of ancient decadent Phrygian kings selling their homelands away in drunken stupors and going to great lengths to prevent repetition of past mistakes."
 wisdom_of_mother_cybele: "Wisdom of Mother Cybele"
 wisdom_of_mother_cybele_desc: "While Cybele has never truly been a part of the Olympian Pantheon, she is the most authentic to the Phrygians, and arguably the most authentic God of any Hellene besides the Iones and Aigaio, being a culturally diverse group of peoples with deeply mixed Hellenic and pre-Hellenic Anatolian ancestry. As the Phrygian cultural identity continues to develop and awaken, Cybele and her message becomes increasingly relevant at all levels of society, becoming a source of motivation and pride for all Phrygians."
 phyrgia_lessons_of_the_cappadocia_wars: "Lessons of the Cappadocia Wars"
 phyrgia_lessons_of_the_cappadocia_wars_desc: "The Cappadocia Wars were a series of military conflicts that sporadically brought Anatolia into conflict with itself throughout the 13th to early 15th centuries. The wars saw the balance of power shift away from the ancient suzerainty of the Pontic Empire as the Cappadocian Kingdom conquered most of its territory in the west while building strong allies out of its vassals in the east. In the 14th century, the Cappadocian king encouraged the diplomatic union of the dynasties of Dorylaion and Synnada, Phrygian rump states left behind from the Phrygian War nearly half a millenia prior, invoking imagery of the ancient Spartans and inspiring an irredentist, anti-Pontic attitude. But when the Cappadocian Kingdom entirely conquered all lands east of Gordion, the seat of the new Phrygian capital, the Phrygians learned to not trust so easily."
 aristocracy_of_the_twin_kings: "Aristocracy of the Twin Kings"
 aristocracy_of_the_twin_kings_desc: "Lavish, decorated, numerous, and powerful, there exists a deeply rooted and powerful ruling class surrounding the royal families in Synnada and Dorylaion, alongside a meritocratic aristocracy flourishing in the official capital of Gordion. It provides for a unique and resounding nobility that finds itself steadfastly loyal to maintaining the status quo."
 kratiste_alitheia: "Kratiste Alitheia!"
 kratiste_alitheia_desc: "Hold True! is a common military command in the Phrygian military lines, renowned for its patience, self-control, and coordination: three traits that make the Phrygian military a truly terrifying force to behold."
 phrygian_recruitment_drives: "Mass Recruitment"
 phrygian_recruitment_drives_desc: "Despite the large nobility seeking glory in battle, a unique type of glory has been cultivated for those who can bring about the recruitment and education of those less fortunate of society, so that they may die for a greater cause. The consequence of this is a somewhat competitive culture cultivated within the nobility of peasant recruitment."
 venetian_ideas: "Venetian Ideas"
 venetian_ideas_start: "Venetian Traditions"
 venetian_ideas_bonus: "Venetian Ideas"
 legacy_of_the_minasatic: "Legacy of the Minasatic Era"
 legacy_of_the_minasatic_desc: "Being the 'middle port' of the Mediterannean comes with its benefits. Ideas and diplomatic connections come to us, with little regard for religion or creed."
 celebrating_albalupus: "Celebrating Albalupus"
 celebrating_albalupus_desc: "Albalupus was truly an iconic image of what it means to be Roman. Having been born into a pagan Helvetic family, his dedication to Mars, Neptune, and Rome would see him join the Roman navy in Venice. He rose to command due to his natural charisma during a skirmish against the Rum Caliphate that left his admiral dead, subsequently defeating three technologically superior vessels. Later, he would take highest command over the Roman fleets, protecting the Venetian Lagoon against the fleets of two separate Rum Caliphs. He will be remembered for eternity for protecting the last thread of the Empire in its darkest hours."
 legacy_of_the_invasion: "Legacy of the Invasion"
 legacy_of_the_invasion_desc: "Since the Turkic and Islamic conquests, what remains of the legions of old are disparate, suffering bands until constant threat of being destroyed by the Islamic rulers that consider them outlaws. While most will accept payment from more than other pagans, over time the success and survival of Venice has encouraged more of them to deepen their connections, which alongside our shared heritage provide us with much better opportunities and greater experience in handling our dealings with mercenary companies."
 hadrianus_socius_naualis: "Hadrianus Socius Naualis"
 hadrianus_socius_naualis_desc: "The Adriatic Marines are one of the most prestigous and elite military forces in all of Rome, having great experience in both land and naval warfare. Putting significant investment into their organization and utilizing them as much as possible is key to asserting safety in the Adriatic, and ultimately the entire Mediterannean."
 restoring_roman_infrastructure: "Restoring Roman Infrastructure"
 restoring_roman_infrastructure_desc: "Horrific symbolism and barbaric cultural influences have permeated all throughout conquered Roman territory, and the further from the heartland you get the worse it becomes. A great deal of work is going to be needed in restoring the Roman infrastructure vision, a key component in the legitimacy of the Empire."
 restoring_roman_identity: "Restoring Roman Identity"
 restoring_roman_identity_desc: "As our grip over the heartland of the Empire strengthens, people learn to quickly return to our rule. The Roman identity is one of safety, longevity and stability. The people will remember the Pax Romana, and quickly shed their new identities for those of their ancestors."
 roman_immigration: "Roman Immigration"
 roman_immigration_desc: "There are many more faithful Romans left than many heathenous rulers realize. In the cover of night, they sneak away from their decaying communities, drawn like moths to flame to the heavenly glow of a Rome in a state of restoration. Whether arriving in vigilante legions, or settling down and paying tribute, they are integral to our revival."
 pontic_ideas: "Póndii Ideas"
 pontic_ideas_start: "Póndii Traditions"
 pontic_ideas_bonus: "Póndii Ambitions"
 heir_to_anatolia: "True Heirs to Anatolia"
 heir_to_anatolia_desc: "More or less for about a millenia, we were the undisputed guardians of Anatolia. Our ruling dynasties, despite some history of infighting, has defended Anatolia from vast threats that have sought to tear the legacy of the Hellenes apart for that entire duration. But as a consequence of the Cappadocian Wars, a series of conflicts between the late 12th to early 15th centuries, we've finally lost that power and been reduced to a minor power in the region. But by divine will of the Gods, and for the sake of Anatolia, we will rise again!"
 legacy_of_the_two_xiphares: "Legacy of the Two Xiphares"
 legacy_of_the_two_xiphares_desc: "The power struggle between Xiphares the Young and Xiphares the Old, the two claimants to the throne during the Pontic Civil War of 2 BC-5 AD, sowed ancient seeds of rivalry and competition amongst our vassals, whose lands were transferred based on whether they were loyal or not to Xiphares the Old and his outrageous land promises that were mostly kept. Phyrgia and Pamphylia, who remained loyal to the Young until the end, would lose almost half their lands, creating deep-seeded hatred that would manifest in the Phrygian War a few centuries later. Cappadocia, once a very minor player in Pontic politics, would become massively influential over the centuries, especially with its conquest of Armenian territory later on. We must never let drawn-out, disasterous conflicts and poor diplomatic decisions result in long periods of military stagnation and decline, and our armies must always be ready to defend our borders."
 mithridatic_princesses: "Mithridatic Princesses"
 mithridatic_princesses_desc: "Our dynasty could become landless, and there would still be great prestige in marrying into our prestigous dynasty. The Princesses of the Mithridatic dynasty have throughout history held great influence in Pontic diplomacy, especially given the deep familial ties of the ruling dynasties of Anatolia."
 the_lessons_of_the_cappadocian_wars: "Lessons of the Cappadocian Wars"
 the_lessons_of_the_cappadocian_wars_desc: "If there's anything we've learned from Cappadocia, it's to never trust your vassals, and never lose a battle. Our soldiers must enter battle knowing that not only their own livelihoods are on the line in the battlefield, but also their way of life for themselves, their families, and their descendants. To know defeat is to know obscurity."
 the_hellenic_marches: "The Hellenic Marches"
 the_hellenic_marches_desc: "Regardless of our poor dealings with our subjects in the past, the deep, feudalistic relationship between the Pontic imperial family and its subject dynasties has always been an important part of Pontic society."
 isaurian_ideas: "Isaurian Ideas"
 isaurian_ideas_start: "Isaurian Traditions"
 isaurian_ideas_bonus: "Isaurian Ideas"
 time_for_isaurian_expansion: "Time for Isaurian Expansion"
 time_for_isaurian_expansion_desc: "For about a millenia, we survived through the endemic decentralization of the Pontic Empire and the diplomatic rivalries that persisted amongst its vassals for centuries. We sat amongst them, barely more than a tributary, closed off and mostly hostile to their concepts and ideas besides paying tribute to the throne at Sinope. Since their downfall, we have been left in a dangerous situation. Our stronger neighbors must be put to heel if we want to secure our continued legacy."
 navigating_anatolian_homeland: "Legacy of the Taurus"
 navigating_anatolian_homeland_desc: "Our homeland existed in the core of the Taurus Mountains, and we have existed on them longer than anybody else. This ancient legacy gives us a long rich oral history to draw upon and vast amounts of experience at warfare within the locality."
 the_last_luwians: "The Last Luwians"
 the_last_luwians_desc: "Our sagas speak of an ancient time before the invading Hellenes, Armenians, and Eranians, when our peoples stretched from the eastern cities of the coast to the interior of Cilicia. We will return to this legacy and bring our people back to superiority in Anatolia."
 appeasing_hypturma: "Appeasing Hypturma"
 appeasing_hypturma_desc: "For millenia, Hypturma's grand spirit has grown heavy with grief from the destruction of the Old Gods, the long-lost spirits which coalesced into Hypturma. Our priests can only lift their spirits through a steady rise of tribute and sacrifice. Hypturma will be sated with the blood and lifelong labors of those who worked to tear down their ancient image."
 large_slave_caste: "Large Slave Caste"
 large_slave_caste_desc: "Our nation maintains a steady flow of enslaved peoples, whose highly valued labors and sacrifices are integral to the maintenance of our way of life. Without them, Hypturma could not be sufficiently sated, and our nation would collapse."
 empowering_the_kartsi: "Empowering the Karsti"
 empowering_the_kartsi_desc: "As our nation has grown, so too has the Kartsi class within our nation. Kartsi, a respected class of eunuchs, have steadily begun to take over our religious institutions, as their detachment from the sexes has brought them closer to the detachment of the Old Gods' ancient forms when they were violently coalesced within Hypturma. This fact and their steadfast loyalty within Isauria has given them a great reputation within the state that has opened up new doors for Karsti into increasingly higher positions."
 breaking_the_decadent_empires: "Breaking the Decadent Empires"
 breaking_the_decadent_empires_desc: "As we grow and expand, it is time to crush the false traditions and idols that keep our neighbors alive. To show them with great force that Hypturma is all that they live for, that we all live for. That their imagination, their inventivity falsifying new faiths, their deception of mankind? It has condemned their descendants to a lifetime of laboring underneath our rule."
 vandal_ideas: "Andalucian Ideas"
 vandal_ideas_start: "Andalucian Traditions"
 vandal_ideas_bonus: "Andalucian Ideas"
 the_great_vandal_migration: "The Great Vandal Migration"
 the_great_vandal_migration_desc: "The lands of Hellas were ripe for the taking. Seeing the weakness of the Roman Empire's grasp over its Hellenic territories after the failures of Rome in Anatolia in the early 5th century, Vandal tribes would move past the Carpathians and unleash themselves upon Hellenic Europe. The scope of the destruction, especially in Macedonia and Thessaly, was one of the most traumatizing episodes of Hellenic history. This violent settlement would encourage Hellenes to flee in their wake - anybody who could crossed the Aegean, but anybody less fortunate was forced to flee into Morea, where overpopulation was already causing significant social unrest."
 vandal_christian_era: "The Christian Era"
 vandal_christian_era_desc: "The Christians were unique amongst Hellenes in their efforts to create functioning diplomacy with the Vandals, who had united under a King shortly after their settlement. Fervently desperate to convert him, they would gain their wishes under the rule of his son by the late 5th century"
 legacy_of_vandal_caliphate: "Legacy of the Andalucian Caliphs"
 legacy_of_vandal_caliphate_desc: "The Andalucian Caliphs, also known as the Haladri Caliphate, brought our peoples into a golden age of innovation, expansion and war. Claiming the title after the death of the last Abbasid caliph, the Andalucian Caliphs conquered everything from the outer boundaries of Yudeah and Upper Egypt in the east, to Qirtaj and Siqilliya in the west, with the highlands of the Andals (Pindus) mountains protecting the Caliphate from Balkan incursion."
 the_first_diyt: "Progenitors of the Diyts"
 the_first_diyt_desc: "While the Ashab Alsababi sect would find its official beginnings in Bal'harm, many of its traditions and ideas were first laid down by influential Islamic writers such as Layndir ibn Turiurith, an Andalucian scholar in service of the Haladri Caliph. His writings and reforms on the Ijma helped give greater power to theological debate amongst scholars in the later 10th century, a foundation which would be built upon and continue in Andalucia and Siqilliya until the Diyt system, which built upon Ijma within Alsababi Islam but distanced itself from the term due to post-Muhammadean corruption, and would supplant it throughout 12th century."
 lessons_of_the_cairo_mamluks: "Lessons from the Cairo Mamluks"
 lessons_of_the_cairo_mamluks_desc: "The last autonomous Haladri Caliph, Samir al-Hassan, died in the 12th century, resulting in a contest for influence between the Samir's brother-in-law Alirik, who ruled in Thrassanan, and a Mamluk council which controlled Cairo and held Samir's only son, the young three-year old also known as Samir. To further complicate matters, Alirik took on the family title al-Samirid, claiming Samir al-Hassan nominated him as the successor should Samir II not have been of age, which he wasn't. Regardless, the Mamluk council would prevent Alirik from landing in Egypt, though the Cairo Mamluks superior navy did little to ease their capability of landing on Nabuthia or Andalucia proper."
 guardians_east_mediterranean: "Guardians of the Eastern Mediterannean"
 guardians_east_mediterranean_desc: "For centuries, we have protected the Eastern Mediterannean, facilitating the movement of luxurious goods and wealth that pass through important coastal arteries of the Silk Road such as Iskandariyya, Tripoli, and Batradid."
 bringing_religious_unity_balkans: "Bringing Religious Unity"
 bringing_religious_unity_balkans_desc: "For centuries, the Balkans have remained a religiously tumultuous region, constantly under the influence of large, foreign powers. However, the relative stability of Nabuthia and southern Andalucia has provided the Balkans with a religious center, one that can safetly spread the true faith across the region."
 pearls_of_the_mediterranean: "Pearls of the Mediterranean"
 pearls_of_the_mediterranean_desc: "For millenia, the valuable pearls of the Mediterranean have provided a stable basis for profitable trade across the region. We have learned from the past and over the centuries we have etched our own niche in the pearl trade."
 modernization_of_andalucian_faith: "Modernization of the Faith"
 modernization_of_andalucian_faith_desc: "If the region has been well renowned in the past for being a center of religious innovation and learning, why should this practice end in comtemporary times? It is vital that we provide the infrastructure and investment into our religious centers to allow our nation to continue to flourish."
 aghustid_ideas: "Aghustid Ideas"
 aghustid_ideas_start: "Aghustid Traditions"
 aghustid_ideas_bonus: "Aghustid Ideas"
 renaissance_of_aybirea: "Aybirean Renaissance"
 renaissance_of_aybirea_desc: "The revitalization of Roman traditions within the Islamic faith is stronger in few places besides here. We lead the frontier of incorporating many traditions that have permeated into the greater Islamic world, and are one of the greatest progenitors of the tradition beyond the Caliph of Rum."
 on_shoulders_of_giants: "On the Shoulders of Giants"
 on_shoulders_of_giants_desc: "Our government is humbled by the great shoes that our nation must fill, though this fills the court with a shared unity, brimming with great ambition to unite the Empires and Caliphates of old. But more importantly, it invigorates our people to spread our great tradition across the world, to frontiers untreaded by even the greatest of Empires."
 aghustid_pax_romana: "al-Salam Ruma"
 aghustid_pax_romana_desc: "The Aghustid dynasty is one of the few to officially update the Pax Romana, reorienting the faiths of the modern peoples of Rome to accept Abrahamic faiths rather than the pagan pantheons of the past. Providing an avenue for pious Romans to convert to the true faith while maintaining their tribute to the holy city of Roma has provided us with great influence within the holy courts of al-Bayt."
 lessons_from_emperor_nero: "Lessons of Emperor Nero"
 lessons_from_emperor_nero_desc: "Emperor Nero was infamous for establishing a long historied foundation of anti-Abrahamic policies that would provide the Romans with a long, painfully slow millenia of slow degredation and decay. We will learn from his mistakes and provide the infrastructure necessary to provide for all peoples of the book."
 melting_pot_of_iberia: "The Iberian Melting Pot"
 melting_pot_of_iberia_desc: "The Emirate and the lands we occupy have a long history of being ruled under the occupation of a vast amount of wildly different peoples, from the ancient Aquiti and Iberian tribes, to Gauls, Romans, Berbers, Arabs, and even Turks. We must accept our vast plurality and provide a stable foundation for all Godly peoples to live in peace."
 the_modern_roman_identity: "The Modern Roman Identity"
 the_modern_roman_identity_desc: "The Modern Roman identity is a tolerant, pious, and scientific one. A humble man who respects the nobility of old, but is rife with curiousity about the natural world. A curious man who reads the Quran and follows along with the processes of religious study to be able to best analyze it in the modern lens and not fall into heretical belief. A man who respects the security of the state and recognizes it as an instrument of Allah's will, which is the ultimate authority. He recognizes that he must be patient with non-believers, for their descendants will recognize the good-will and fair treatment given to them by the state and understand the true way is through Allah."
 the_julio_claudian_sayyids: "The Julio-Claudian Sayyids"
 the_julio_claudian_sayyids_desc: "We have a deep family tree that ties our dynastic line back to the Roman Emperors of the Julio-Claudian dynasty alongside the Aal al-Bayt, making us additionally Sayyid. Our leaders are the culmination of the greatest of men."
 sebkhemerzi_ideas: "Sebkhemerzi Ideas"
 sebkhemerzi_ideas_start: "Sebkhemerzi Traditions"
 sebkhemerzi_ideas_bonus: "Sebkhemerzi Ambitions"
 legacy_ewarzdagr: "Legacy of the Ewarzdagr"
 legacy_ewarzdagr_desc: "The Ewarzdagr refers to the efforts of Iranian mercenaries and priests to venture to the Balkans and other post-Mongol states, spreading the true faith far and wide. It is from the closing years of this era that the Sebkhemerzi army managed to stake out its claim amongst the quarrelsome Khans, once being hires to the Balik Khan."
 legacy_spah_burzafrah: "Legacy of Spah Burzafrah"
 legacy_spah_burzafrah_desc: "An illuminated theologian, well-decorated military leader, and excellement administrator, Spah Burzafrah was born into the chaotic fragmentary period of Iran. Raised in the hardship of famine and destruction brought about by the Ilkhanate invasion and separated at a young age from his family unit, Burzafrah would learn Manichaean theology from a missionary group known as the Kirbagazmani (Virtue/Good deed of Mani) that served many Iranians across the fragmented empire who were put into impossible, destitute circumstances. But a life served picking up after unpious Shahanshahs that pulled in darkness from all around them left Burzafrah disillusioned, and his charismatic character would afford himself a large following from the Kirbagazmani, the beginnings of the Sebkhemerz. Surviving off mercenary efforts, and proselyzing Manichaeism everywhere he went, Burzafrah became a central part of the Ewarzdagr, helping bring the full force of Manichaeism into Europe."
 literacy_programs: "Literacy Programs"
 literacy_programs_desc: "There's little point in our mission if we can't illuminate those whom we liberate from the forces of darkness. Monastic schools should be a major investment of our country so that our people may learn the great truths of the Universe!"
 mithraic_plurality: "Mithraic Plurality"
 mithraic_plurality_desc: "Within the context of worship of the light and goodness of the world, no distinction can be made from place of origin. All are welcome to participate in the Sebkhemerzi movement!"
 dagr_tradition: "Dagr Traditions"
 dagr_tradition_desc: "Our rich legacy of travel has provided us with the motivation and know-how to establish robust, distant supply routes, maintaining the integrity of our soldiers on faraway missions of peace across the world."
 rich_literature: "Rich Literature"
 rich_literature_desc: "Our nation is a melting pot of several different peoples, and many books are translated to and from a vast number of Iranian, Hellenic, Arabic, Latin, Turkic, & Runic languages, giving us a breadth of cultural, technological, literary, and historical traditions from which to draw from. Our libraries are vast and our peoples are truly wise."
 future_of_the_order: "Future of the Order"
 future_of_the_order_desc: "Astounding new concepts and ideas have been brought forward to the attention of the court as our nation and its peoples begin to develop a distinct identity of nationhood. If we and the things we have learned are to survive in this exciting new era of history, we must be proactive and develop innovative programs in order to gain an edge over our neighbors."
 balik_ideas: "Balikaac Ideas"
 balik_ideas_start: "Balikaac Traditions"
 balik_ideas_bonus: "Balikaac Ambitions"
 legacy_balik_khans: "Legacy of the Balik Khans"
 legacy_balik_khans_desc: "Jochi Khan, the first Khan of Ulug Ulus (and by extension Balik Ulus), continued the legacy of his predecessor Genghis Khan, conquering the Balkan Mountains and most other territories south and/or east to the Carpathians up to the Roman fortress-city of Illeropoli and the Andalucian strongholds in the Andals (Pindus), who would stand firm against further conquests. But his son Batu had a new vision for some of the lands he helped conquer. He invisioned a vast, grand city, one built for the settlement and enrichment of his peoples, one that would become the crown jewel of the Mediterranean. Allured not by the beauty of the well-defendable Balkans to build his mountain-fortress, Batu Khan would found the center of his dynasty on the ruins of an insignificant Hellenic coastal town facing across from the Hellenic port-city of Chalcedon, setting the foundations for the modern fortress-city of Balik."
 balikaac_aristocracy: "Balikaac Aristocracy"
 balikaac_aristocracy_desc: "Owing to a great period of learning, translations of texts, and the integration of the cultural heritage of many conquered populations allured to swiftly de-tribalizing society in the growing capital of Balik, the peoples who would become known as the Balikaac began to swiftly distinguish themselves. A new civilized and learned society had founded itself on the Mediterranean, one that would find itself quickly incompatible with the nomadic lifestyle shared by most of Ulug Ulus. The creation of the Balik writing system, one that mostly derove from its eastern heritage, added new characters and symbols adopted from neighboring Hellenic and Arabic speakers, allowing most Hellenic languages and Arabic to be written in the Balik system."
 legacy_mardayate_khan: "Legacy of Metradis Khan"
 legacy_mardayate_khan_desc: "Metradis Khan, named after the legendary Pontic Mithridates and the many who succeeded him, was the only son of Berke, who became prince of Balik upon the succession of Sartaq Khan as Khan of Ulug Ulus. While Balik served as capital of the Ulug Ulus throughout the reign of Batu Khan, Sartaq Khan would move the capital of the Khanate to Ukek from which to better collect tribute from his easterly vassals, leaving Berke as suzerain vassal in Balik, entrusting his uncle to protect the khanate beyond the Danube. However, as Metradis came of age, he grew to despise the ruling dynasty of Ukuk and the nomadic Khans, ultimately leading a successful revolt against them a mere 3 years upon his rise to power, becoming the third Khan to rule from Balik when the peace was drawn in 1269. More importantly, however, he was the first truly Balikaac Khan, a multilingual Balikaac who enjoyed a great decree of learning in literature and the arts. His beautiful calligraphy, which masterfully illuminate the most beautiful aspects of the Balik system and are proudly showcased with his other priceless works in the Khan's grand palace, are just a piece of the rich tradition he built from which we draw from."
 manization_state: "Manization of the State"
 manization_state_desc: "Throughout the later years of Metradis Khan's rule, Manichaean bishops and priests first began to seek giving counsel, the beginning of the Ewarzdagr Era that saw a great migration of Manichaeans and Iranians to the region. While Metradis Khan consistently professed throughout his early years having given tribute to a large breadth of Gods beyond the mandate of Creation, such as Hellenic and Roman gods, he was a staunch worshipper of the Earth Mother, an integral aspect of creation. This fact, alongside his silence on his faith later in life, leads many to believe he had converted to Manichaeism later in life. Regardless, his sons Ulai Khan and Yunarka would profess to Manichaeism by their middle years, and from thenceforce our destiny would become irrevocably intertwined into the rapidly growing world of Mani."
 impenetrable_city_balik:  "The Impenetrable City"
 impenetrable_city_balik_desc: "Many know Balik for its impregnability. Developing innovations adapted and improved upon from many of our neighbors designs, we quickly learned and perfected the defensive benefits that come with civilized life, earning Balik its fearsome reputation over the first few generations of the independent state as a virtually untouchable fortress-city."
 cavalry_killers: "Cavalry Killers"
 cavalry_killers_desc: "Owing to a nomadic past and our contemporary contempt for our nomadic neighbors, our military has spent a great degree of time considering the best methods for annihilating its enemies' large stretches of cavalry. We must turn our land army into an elite army of cavalry killers."
 balikaac_administration: "Balikaac Administration"
 balikaac_administration_desc: "We have developed for ourselves an advanced and innovative system of administration that has become the template of sorts to proper governance all throughout the Turkic and Mongol speaking realms of the world. The wild success of our administrators and our industrious nature have truly made us the envy of all our faraway brothers!"
 abindari_ideas: "Abindári Ideas"
 abindari_ideas_start: "Abindári Traditions"
 abindari_ideas_bonus: "Abindári Ambitions"
 the_first_arabians: "The First European Arabs"
 the_first_arabians_desc: "In the later years of Roman control over the Levant and Arabia in the 1st century AD, many Nabataeans were Romanized and recruited into the Roman system, being one of the most loyal groups to the Romans in the region. Thus, upon the downfall of Roman control in the Levant in Arabia due to the mounting religious unrest and the force of neighboring powers such as Pontus and Armenia left many Nabateans deciding to follow the Romans back into the empire. Many of these people would move to Graeci and Egypt, becoming a distinct diplomatic and mercantile class of the Roman Eastern Mediterannean, becoming intermediaries for Rome's relationships with Aramean and Arabic peoples."
 competetive_roman_heritage: "Competitive Roman Heritage"
 competetive_roman_heritage_desc: "A new geographic home for these Nabatean Romans would not become evident until by the 5th century at the earliest, when significant enough Roman Arab populations existed in new Peloponnesian settlements such as Petradid (modern Batradid) & Sabara. Roman Arabs competed with indigenous Graecoi for land ownership and securing local trade routes, gaining ownership over most of the Peloponnese amongst their wealthiest families, consequently impacting the culture of the Graecoi around them."
 the_legacy_of_the_indi: "Legacy of the Indi"
 the_legacy_of_the_indi_desc: "The Indi were originally Indian merchants who settled in large numbers on the coasts of the Roman Egyptian Red Sea in waves throughout the 1st-11th centuries AD, gaining widespread citizenship when created a steadfast loyalty to Rome. When Egypt would fall to Islamic invasion in the 7th century, the vast majority of Indi with citizenship would flee with Rome, bringing about the beginnings of the Indi on the European continent alongside a massive second wave of Egyptians. While many Indi had already found great success in settlements mostly concentrated in Morea and would provide refuge for their large extended families, many others would find themselves to be complete vagabonds, starting a multi-generational pilgrimmage across the continent."
 influence_from_egypt_abindaria: "The Vandals"
 influence_from_egypt_abindaria_desc: "For centuries, Christianized Vandals from the north threatened Morea's culture - their inhabitants' rich history of demonizing Christians made such a power shift deeply unsettling. Vandal attempts at conquest were stifled by the persistance of the Roman Empire to hold it, influenced by diplomatic ties to the Illyrian military aristocracy & the legacy the Roman Nabateans had left on it, making it a prestigous, Roman land of great value, shared by Arabs, Indi, Romans, and Graecoi. \n\n It wasn't until the rise of Islam & the Vandal King's conversion that proselyzation efforts began to show success. Scholars of this new Andalucian culture grew interested in the development of the local culture and heritage, encouraged by their fascination with the language, a Semitic (Arabic) language with Indian influences written in a vulgar Latin alphabet, incorporating Arabic and Indian sounds with accents, along with the Greek Epsilon for the letter 'Ayn (portrayed in-game as á). Arabs and Berbers would call these peoples and their language the "Arabized Indians of Rome", which would ultimately evolve into the local endonym of Abindári. Islam was the dominant religion of the peninsula by the 9th century, and popular revolt, supported by the Haladri Caliph, would see the peninsula wrested from Rome, a transition of power that left their language & culture intact, viewed as the liturgy of the Quran's strange yet interesting cousin."
 weathering_post_haladri_era: "Weathering the post-Haladri Era"
 weathering_post_haladri_era_desc: "The Haladri Caliphate saw the domination of the Abindári-Andalucian culture, with most pagan Romans and Graecoi left migrating across the Aegean and the Adriatic. The terms Morea and Peloponnese would die out, being rarely if ever used by Arabs, who referred to the peninsula as al-Abindárum. \n\n The end of the Haladri Caliphate was time of great stress and worry of destruction, with the threats of Mongol and Turkic incursion from the north and Hellenic incursion from the east ever-present - and little in the ways of a large military authority to protect them. But the Samarid Emirate would find repeated success agasinst the Balik Khan, while the rise of the Ashab Alsabab created a new dynamic in the Islamic community that gave Andalucia and Abindárum much greater prominence and the protection of the regional community."
 friends_with_great_religious_thinkers: "Kinship to Italia"
 friends_with_great_religious_thinkers_desc: "What truly has allowed Abindárum to thrive is its deep connections to Italia. What began as a deep interconnection of Roman identity strengthened by military and mercantile bonds would soon strengthen itself further with Abindári efforts to proselyze the Latin world and bring the Quran to Roman communities in their indigenous language. A controversial practice in most of the Islamic world was dismissed as a non-issue in most Alsababi diyts, as modern Alsababi interpretation of the Quran was considered more honest than leaving the reader to interpreting the original, and Latin translations of the Quran flourished. The Caliph in Rum has recognized the efforts of the Nabuthi to the success of the faith since 1372, when he came to the defense of Nabuthia's autonomy when threatened by the Samarid Emir."
 abindaria_islamic_educational_center: "Islamic Educational Center"
 abindaria_islamic_educational_center_desc: "The rise of Nabuthia to great prominence in the 14th century within the Alsababi world has been rewarded with an appeal to scholars and thinkers from all across the Mediterranean, making Abindárum a center of theological thinking and an attractive place to live for the wealthy. Their contributions to the development of Abindárum has allowed us to grow the nation to great proportions."
 latlerin_ideas: "Latlerin Ideas"
 latlerin_ideas_start: "Latlerin Traditions"
 latlerin_ideas_bonus: "Latlerin Ambitions"
 legacy_of_mongol_empire: "Legacy of the Mongol Empire"
 legacy_of_mongol_empire_desc: "The rise of Genghis Khan and the empire he conquered across Eurasia forced our ancestors across the world, sharing in his bounty out of a desire for survival. But in the great fortress cities of the Adriatic, our ancestors discovered an alternative way of life. The very core of our nobility derives its heritage from those early Turks who saw the value in protecting what their new neighbors had created, and repulsed what would have become an inevitable devestation of their lands."
 defenders_of_illyria: "Defenders of Illyria"
 defenders_of_illyria_desc: "For centuries, we have protected the shores of the Adriatic and its grand cities. While many of the jewels of this centuries-old era were lost to tribal incursion, this great sense of loss gives our people a union of vigor in rebuilding the prestige of older times. We will continue to innovate upon our already excellent fortress designs so as to prevent any sort of repetition of history."
 maintaining_latlerin_suzerainty: "Maintaining Latlerin Suzerainty"
 maintaining_latlerin_suzerainty_desc: "It is only within the diplomatic web of the Adriatic that we will be able to maintain our continued autonomy. We must embrace subterfuge as a matter of survival."
 latlerin_legacy_rum: "Legacy of the Caliph of Rum"
 latlerin_legacy_rum_desc: "While the early pagan Turkic dynasties of the Mongol era threatened the stability and prosperity of the Adriatic, the invasion of Rome in the 14th century brought about a rapid shift of the dichotomy between the Latlerin, the Romans, and the Italyan Turks. Once viewed as black sheep by all, Latlerin culture was suddenly seen as sophisticated, ideal, aspirational. Within the promise of Allah came a privilege and acceptance that became deeply integral to the rapid awakening of Latlerin identity."
 transcribers_dalmatia: "Transcribers of Dalmatia"
 transcribers_dalmatia_desc: "Given our nation's literacy in a variety of Bati Oghuz, Balikli, and Latin languages, we have produced a great number of prestigious transcribers throughout the Islamic era. By continuing to encourage transcribers and other administrative work, we can create for ourselves a more efficient bureacracy as well."
 contesting_foreign_faith: "Contesting Foreign Faiths"
 contesting_foreign_faith_desc: "One of the great challenges of the region is not allowing pervasive religious thinking to permeate within the population. Constant exposure to pagan and heretical ideologies certainly has a negative impact on our populace over time, making it vitally important that we invest enough in conversion efforts and provide stability to the region, and our people."
 rich_latlerin_legacy: "Rich Latlerin Legacy"
 rich_latlerin_legacy_desc: "Owed to our integration into the cultural legacy of Rome and our dedication to Allah, the prosperity of our society has grown steadily over the centuries. The long term impacts of this success show as more of our people are proud now than ever to call themselves Latlerin."
 saray_turkig_ideas: "Qashqai Ideas"
 saray_turkig_ideas_start: "Qashqai Traditions"
 saray_turkig_ideas_bonus: "Qashqai Ambitions"
 legacy_of_the_khaganate: "Legacy of the Khaganate"
 legacy_of_the_khaganate_desc: "Throughout the 13th century, the Khaganate of Genghis irrevocably changed the destiny of Southeastern Europe. Fleeing their destruction were our ancestors, who became rulers of our modern territory and began to slowly discover the rich legacy of the Roman Empire."
 influence_of_the_latlerin: "Influence of the Latlerin"
 influence_of_the_latlerin_desc: "Many of our people would renounce our authority and accept the vassalization of the Roman Empire, an initially confounding situation. Though as time passed, it became increasingly clear that the divine forces that had blessed Genghis Khan with his conquests weren't a reward for Genghis, but rather the only event that could have transpired that could bring us to the throne of the Roman Empire. The forces of light had to take decisive action in a physical plane thick with the evil of darkness, despite the costs."
 sunlight_from_east: "Sunlight from the East"
 sunlight_from_east_desc: "While for many years, an uncritical repetition of our ancient tradition left us blind to the stunning light in front of us, saviors soon began to arrive over the eastern horizon. Following the call of light to help guide our divinely ordained peoples, the first Manichaean priests began to arrive to enlighten us of the battle that rages throughout the universe. Through their ceaseless efforts and ironclad persistence we finally began to see the truth that had been so clearly laid out in front of us. The efforts of great Emperors, from Iran to Rome, were machinations of the powers of good trying to lay a clear message to humanity, a plea to see the light."
 betrayal_of_the_italyans: "Betrayal of the Italyans"
 betrayal_of_the_italyans_desc: "While the philosophers and scholars of Saray diligently studying the theological work of the Romans and discovering the many hidden threads that tie their ancient faith to the work of Mani, one of the prominent Turkic Khans crossed the Adriatic, bringing swift death to the Roman dynasty and installing their own. Worse yet, this Khan enjoyed the blessing of an Arabic heathen, suddenly becoming the religious warlord of a Semetic faith that sought the extermination of Turkic, Roman, & Iranian tradition. This great deceiver, a bastion of darkness, would begin to bleed Italia, leeching the identities and traditions of all the peoples it conquered. It is of paramount importance that we build in our people a strong theological tradition, so as to prevent the destruction of our region's rich history and its pious dedication to the boundless designs created by the Mother of Life, the Living Spirit, and his five sons in the First Creation."
 catalyzing_roman_ideas: "Catalyzing Roman Ideas"
 catalyzing_roman_ideas_desc: "While the great designs of Rome were truly a marvel to behold, they had created for themselves but one rich tradition. By intertwining them with the greatest ideas and legacies of the Iranian Empires, our nation can become that much more efficient and prosperous."
 aristocracy_of_bistuensium: "Aristocracy of Saray"
 aristocracy_of_bistuensium_desc: "In Saray, a grand aristocratic culture has developed due to its importance to the religious world of Mani and our careful investment in theology and education. A rich academic culture brings with it great leaps of innovation, and the city's importance to the entire nation has made it that much easier for our dynasty to assert its influence."
 craftsmen_of_third_rome: "Craftsmen of Third Rome"
 craftsmen_of_third_rome_desc: "It is from here that we have launched our project to revitalize the Empire of Rome. While the Second Rome represents an era of decadence, decay, and darkness, we are building the blueprint for the Third Rome, the upcoming era of revival, restoration and renewal."
 maritimae_ideas: "Maritimae Ideas"
 maritimae_ideas_start: "Maritimae Traditions"
 maritimae_ideas_bonus: "Maritimae Ambitions"
 legacy_roman_uprising: "Legacy of the Roman Uprising"
 legacy_roman_uprising_desc: "In 1441, the previous government of Maritimae renounce their faith in the only god, returning to a tribalistic festization of idoltry right in the face of the Caliph. Caliph Fâkih's call to arms against these obscene pagans awoke within Idios a divine call of destiny, who recognized more-so than anybody else how this interfered with Allah's plans for their helpless peoples. Idios answered the call to arms with more than his humble retinue, he answered the call with his entire mind, body, and soul, pouring every effort into seeing their terrible example put to the sword."
 ambitions_of_idios: "Ambitions of Idios al-Madiya"
 ambitions_of_idios_desc: "When Caliph Fâkih granted suzerainty of the Bogelik of Maritimae to Idios, a humble man of lower nobility, he soon realized the true purpose of his new Emirate's heathenous actions. Allah had great plans for Idios, and by granting him land on the doorstep to a massive, heathenous Empire that shut its eyes to Allah's truth, he knew what had to be done."
 courting_northern_neighbors: "Courting the Germans"
 courting_northern_neighbors_desc: "Many Germans have already seen the truth so clearly laid out in front of them. The Helveti, steadfastly loyal to Rome and greatly influential to its legacy, were one of the first to see the truth. But the Alemanni have struggled greatly in overthrowing the tyranny of their false Gods, secured by their deeply-rooted ties to their empire. But the piety of Isolde is testament to their desire to be saved, and so every effort must be made to help those living under their oppressors to see the light and assist us and making a difference for their peoples."
 carving_al_theyuta: "Carving al-Theyuta"
 carving_al_theyuta_desc: "While it may almost seem like a fantastical concept, one should never doubt the miracles that Allah will create in order to secure a brighter future for humanity. al-Theyuta, a Germany united by Allah, is not a dream, but rather a vision of the future. We have been blessed with our position in the world, and we must show our gratitude by putting our faith to the test of the sword."
 connecting_mediterranean_german_trade: "Connecting European Trade"
 connecting_mediterranean_german_trade_desc: "Our military efforts have opened new doors for our peoples for trade, new inland trade routes where one worries not of Norse or Shia competition. In this new emerging route of European trading, we alone are the dominant players."
 leniency_to_germanic_paganism: "Leniency to the Pagans"
 leniency_to_germanic_paganism_desc: "If we are to have any hope of converting such a massive amount of damned souls, we must learn to coexist with these non-believers. By providing for them an opportunity for enlightenment, their heathenous ideas will whittle away, exposed to the truth."
 elaborate_mosque_design: "Elaborate Mosque Design"
 elaborate_mosque_design_desc: "Most of our new mosques are built in lands never before exposed to mosques, and as such they are an important part of our society and converting others to the true faith. We take great pride in our elaborate mosques, and they serve the job of saving our people well."
 kurudijuha_ideas: "Kurudiju!ha Ideas"
 kurudijuha_ideas_start: "Kurudiju!ha Traditions"
 kurudijuha_ideas_bonus: "Kurudiju!ha Ambitions"
 legacy_haiarab_kurudi: "Legacy of the |Nu!arib Kurudi"
 legacy_haiarab_kurudi_desc: "The contemporary Kurudiju!has can find their origins in the |Nu!arib Kurudi, an effort by several nomadic Q'a Numi religious orders with diverse origins from many tribes across the Namib, to conquer the ancient lands of the first Saadzahi Kx'ai. Encouraged by bloody stalemates in Central Africa, part of a centuries-long period of ever-growing military failures and the breakdown of most of the old Kx'ais. This era marked the beginning of a return to tribalism and conflict between the Q'a Numi faithful, a trend that concerned the most faithful of those of the Namib. To reinvigorate the faithful, Sig|i !'Am||ae |Naa||qhaa started uniting many disparate groups and individuals loyal to the cause of Kurudi. In his search for an army of faithful, he inspired the efforts of competing Kurudiju!has, such as the Zed'a and Qhaanue Kurudiju!has, and have begun a string of reconquests across the |Nu!arib, successfully conquering most of the region beyond Mjimbali."
 num_protection_soldiers: "Extensive N/um Training"
 num_protection_soldiers_desc: "N/um, a powerful practice of healing originally practiced by the !Kung, but now widespread across the Q'a Numi realm, is a major source of pride of our people, who are dominately !Kung in their origins. Our military makes every effort to seek out inherentely talented healers, who make up nearly 40% of the entire army, and ensure that they reach their fullest potential."
 migratory_roots_kurudijuha: "Migratory Roots"
 migratory_roots_kurudijuha_desc: "Our people, perhaps more so than most of the many cultures of the Q'a Numi world, yearn for new territories and lands. Adherents to !Hado are virtually nonexistent, and we dream of revealing Kaggen's lies to every stretch of the known world."
 egalitarian_administration: "Egalitarian Administration"
 egalitarian_administration_desc: "For all our known history, everyone has had equivalent agency within our tribes, united in times of feast and famine. While a vague hierarchy has evolved out of the rise of the Q'a Numi faith and a transition to a sedentary lifestyle, there still exists little difference in lifestyle between the classes of our society. Our social ladder, to some, may seem startlingly small, though our deeply connected society is rife with intellectuals and innovative thinkers."
 extensive_qanumi_education: "Extensive Q'a Numi Education"
 extensive_qanumi_education_desc: "We must give thanks to the Sun and Moon for their efforts in securing for our peoples a future, and for crafting the likeness of Saa Dzahi and providing us a path to see humanity be restored to its true beliefs. As many societies of our faithful bretheren fall into a tragic period of theological and moral decline, we must take on the mantle of justice and secure the future of our faith."
 global_kurudi: "The Global Kurudi"
 global_kurudi_desc: "No helpless nation entrapped within a design of Kaggen will be left unsaved. We will provide civilization and dignity to the smoldering ruins of the trickster's designs, from the shores of Western |Urubaa to those of East Asia, and any that lie beyond."
 name_love_people: "N||am-e Philosophy"
 name_love_people_desc: "A society is only as strong and prestigous as its lowliest constituents. We must make every effort to give all those who rely on our administration a dignified existence. Providing all our peoples with a chance at success will only make us stronger, provide us with new concepts and ideas, and strengthen the bond of our state, no matter where."
 uitaa_ideas: "!Ui-Taa Ideas"
 uitaa_ideas_start: "!Ui-Taa Traditions"
 uitaa_ideas_bonus: "!Ui-Taa Ambitions"
 dominant_heritage_qanumi: "The First Q'a Numi"
 dominant_heritage_qanumi_desc: "As the people to provide Saa Dzahi with his enlightenment and heritage, we were the first to listen to his important message. Our ancestors grinded the slave trade of Southern Africa to a halt during the glorious era of the first Saadzahi of Qhaanue, and then, remaining as faithful as ever, crossed the Namib with him, rewarded with safety and a new homeland."
 legacy_second_exodus: "Legacy of the 2nd Exodus"
 legacy_second_exodus_desc: "The crossing of the Namib, an event known as the Second Exodus, happened as a consequence of an Islamic invasion of the first Kx'ai of Saadzahi. Blessed by the Moon with an uncharacteristic and rare cooling of the sands, and vast quantities of wild game, our peoples not only survived the migration, but flourished, bringing great successes to Saa Dzahi's final conquests across Central Africa."
 progenitors_of_kunaa: "Progenitors of Kunaa"
 progenitors_of_kunaa_desc: "The Kunaa writing system was first developed by Taa scholars in Tsumeb during the Un!omi era following Saa Dzahi's death, a writing system that fully incorporated the varied tonal systems, click consanants, and other phonetic stylizations of the Taa-!Kwi. While over time, Proto-Kunaa would evolve into its modern form, one that incorporates the unique properties of our sibling language families of Khoe and !Kung. Without our efforts, the ease of communication and spread of information that gives our faith a sense of community would have never cultivated."
 bringing_peace_continent: "Bringing Peace to the Continent"
 bringing_peace_continent_desc: "The malicious forces of Kaggen would see the continent burn. We will be the shield needed to save our homeland."
 innovative_qanumi_administration: "Innovative Administration"
 innovative_qanumi_administration_desc: "Harkening to our storied legacy of Kx'ais, we have developed a great understanding on how to administer our many peoples. Our government will make sure none of left behind."
 uniting_against_slavers: "Uniting Against the Slavers"
 uniting_against_slavers_desc: "Slavers would see our people be stolen away from their homeland, never to see their tribes or home again. It is of paramount importance that we conquer the hearts of these trades, and snuff them from the annals of history."
 championing_prosperity: "Championing Prosperity"
 championing_prosperity_desc: "Should our conquests fail, or the risk to our peoples be too great from them, then we shall make for ourselves a home so glorious, it shall be the envy of the world. Our capital shall become the crown jewel of civilization."
 kung_ideas: "!Kung Ideas"
 kung_ideas_start: "!Kung Traditions"
 kung_ideas_bonus: "!Kung Ambitions"
 legacy_namib_settlement: "Legacy of the Namib Settlement"
 legacy_namib_settlement_desc: "As the majority of !Ui-Taa migrated north in the stead of the Saadzahi Kx'ai and its successors, many !Kung tribes were converted to the true faith. These tribes would migrate to the Kx'ais and the Namib, many of whom would intermix and integrate with their Taa neighbors, however, those !Kung tribes on the Namib frontier would continue to persist to this day."
 intricate_kinship: "Intricate Kinship"
 intricate_kinship_desc: "There are many different kinds of kinship within !Kung society, likely some of the most complicated kinship patterns of any of our neighbors. These intricate levels of kinship almost always provide for any combination of people a clear hierarchy of respect. At the center of our world are those genealogically related, our fathers, mothers, brothers and sisters. Just as important are the !kun!a, those who share your name. In matters of dictating kinship relations, the elders are always given precedence.\n Marriages hold a great political purpose in the connection of disparate ends of the tribes together, but divorce is simply as easy as running away from the ceremony kicking and screaming, as it has always been. From this point on, the community will come together to decide if the marriage is really the best for the couple, and in this situation, kinship relationships become incredibly important. This interconnectivity, however, allows our communities to easily regulate themselves with the influence of their elders, and quickly connect into newer communities."
 rich_juhoan_literacy: "Rich Ju|'hoan Literature"
 rich_juhoan_literacy_desc: "The literary tradition of the Ju|'hoan began shortly after the development of the proto-Kunaa script, which was quickly and efficiently translated into many different Ju|'hoan languages. Grand stories of the ancestors, the rich history of the Gods and their positive impact on our livelihoods has been a major boon for all peoples of the faith."
 passion_for_num: "Passion for N/um"
 passion_for_num_desc: "Healing practices, known to the !Kung as N/um, have always been a prevalent part of our way of life. Nearly 35% of the entire population practices healing, providing remedies to all sorts of malaises of the mind and body. This information is shared freely and readily amongst our peoples, and while the practice has spread to other Q'a Numi communities, none so prevalently as those with !Kung heritage."
 riches_namib: "Riches of the Namib"
 riches_namib_desc: "In the mountains of the Namib, valuable ores are awaiting our discovery just underneath the surface. A vast wealth can be found here in this bountiful land we have made our home."
 connecting_qanumi_world: "Connecting the Q'a Numi World"
 connecting_qanumi_world_desc: "Our trade carvans spread information and ideas from Tsumis to Ashkam. Without our dutiful service to our communities, the success of the Q'a Numi world would be put in a most grevious of perils."
 militant_zealotry: "Militant Zealotry"
 militant_zealotry_desc: "Our tribes and peoples have participated in a great many number of wars for the faith, and have treaded vast distances to spread his cause. This pride and prestige bleeds thoroughly into the minds of our military, who fully understand the religious virtue of their work in defending our homeland."
 khoe_ideas: "Khoe Ideas"
 khoe_ideas_start: "Khoe Traditions"
 khoe_ideas_bonus: "Khoe Ambitions"
 legacy_khoe_conversions: "Q'a Numization of the Khoe"
 legacy_khoe_conversions_desc: "One of the last language families of non-Bantu South Africans to have effective translations in Kunaa, and subsequently the last to assimilation, the disparate groups who refer to themselves as Khoe were in actuality converted at different stages. For example, the !'O'!Kung tribe was one of the earliest tribes to convert to Q'a Numi, migrating south to war against Islam. However, the rocky road of converting the majority of the Khoe population has left a diverse legacy of ideas, and many unique appropriations of !Ui-Taa and !Kung cultural practices."
 powerful_num_priesthood: "Powerful N/um Priesthood"
 powerful_num_priesthood_desc: "The !Kung healing practice, known as N/um, would ultimately spread to Khoe tribes, though on a much more selective basis. Those with the powers to heal are given special status and privilege within society, but must show must greater talent than the average N/um healer of passion. As a consequence, our healing population is as low as 4% of the population, but their skill and talents are some of the greatest of the entire Q'a Numi world. These influential healers tend to serve as tribal ambassadors, being the pride of their people."
 legacy_karoo_kurudi: "Legacy of the Karoo Kurudi"
 legacy_karoo_kurudi_desc: "Khoemana and !'O'!Kung Kurudi efforts in South Africa have, for the most part, been a success at driving the Muslims out of the interior of South Africa throughout the 11th-15th centuries. The Khoemana Kurudi of the Karoo, a resounding success, provided the Ehmlangeni and Baphuthi tribes with their modern territory."
 strong_hierarchal_tradition: "Strong Hierarchal Tradition"
 strong_hierarchal_tradition_desc: "While some might scoff when we regard our culture as hierarchal, given the vast amount of injustice that permeates throughout most foreign societies, by the standard of a Q'a Numi nation, we are a very authoritarian people. We have found the fine line between providing for our people too many freedoms, and creating tyranny. With few, prominent healers, and the wisest of elders given special prominence in decision making, we are taking the best of both worlds to make the best decisions possible for our society."
 expediating_cultural_expansion: "Expediating Cultural Expansion"
 expediating_cultural_expansion_desc: "It's more important that we scatter Kaggen's followers to the wind than spend the unreasonable effort necessary to change all of their minds and hearts to the truth. By removing access to their religious institutions, and expelling these heathens across the planet, these deceived souls can find peace in nature again and hear the call of the true Gods on their own journeys. And should the faithful find themselves in far-flung corners of the world, they will treat the indigenous peoples will dignity so as to provide them a path to hearing the truth."
 empowered_kurudijuha: "Empowered Kurudijuha"
 empowered_kurudijuha_desc: "To improve our military, we must provide a third path of power for our people, beyond the practices of healing and ageing. To find glory in combat for the faith and survive many battles is a clean indication of a true leader."
 merciless_to_kaggen: "Merciless to Kaggen"
 merciless_to_kaggen_desc: "Ultimately, Kaggen and his followers would see our continent picked apart like a vulture on carrion. We must give his rhetoric no quarter, and find and destroy every stronghold of his influence across the world."
 skithi_ideas: "Szkíthi Ideas"
 skithi_ideas_start: "Szkíthi Traditions"
 skithi_ideas_bonus: "Szkíthi Ambitions"
 skithi_magyar_legacy: "Magyar Legacy"
 skithi_magyar_legacy_desc: "Our peoples remained a nomadic part of the Federation of Magyars mere centuries prior, and this heritage is evident in the roots of our language."
 scythian_assimilation: "Sedentary Life"
 scythian_assimilation_desc: "Influenced by neighboring sedentary Turks, Iranians, and Hellenes, our divergence began from the Magyars with how quickly we became sedentary in the east. In doing so, we would assimilate many of our neighbors, including the scant remnants of the Sarmatians and Scythians, now since fully incorporated into our legacy."
 assimilating_ewarzdagr: "Assimilating the Ewarzdagr"
 assimilating_ewarzdagr_desc: "The Ewarzdagr migrations of Iranians, a consequence of the Sassanid downfall to the Ilkhanate, would probably not impact any nation so dramatically as it had ours. We experienced probably the greatest number of Iranian settlers out of any in the path of the migration, and it is in this era that we began to see ourselves as Szkithans, adopting the name that the Iranians would give us and our land upon arriving, alongside the religion of Mani, and for the most part, their language."
 humbling_the_great_state: "Humbling the Great State"
 humbling_the_great_state_desc: "Our lands, rapidly growing in wealth and at this point completely sedentary, grew increasingly dissatisfied with the rule of the Ulug Ulus, who refrained from even accepting Mani as a prophet. With the support of Ewarzdagr Iranians, and at the peak of the Ulug Ulus's conflicts with the Hellenes, Slavs, and Norse, we would gain our autonomy."
 gatekeeper_of_black_sea: "Gatekeeper of the Black Sea"
 gatekeeper_of_black_sea_desc: "In our position, we are uniquely poised to dominate the trade of the Black Sea, regulating all that leaves its waters headed east into the rich Silk Road trade of the Volga and Central Asia."
 humbling_rodhaenger: "Humbling the Rodhaenger"
 humbling_rodhaenger_desc: "To our north, the Rodhaenger swarm the Bulgars, pressing ever onwards in their bid to dominate the entirety of Eastern Europe. We must do everything in our power to curb their influence before it gets out of hand."
 masters_of_pontic_steepe: "Masters of the Pontic Steppe"
 masters_of_pontic_steepe_desc: "The only road to our continued survival is to carve out for ourselves a grand empire on the Pontic Steppe, one large enough so that no nomadic force can dominate us again."
 bogelik_ideas: "Italyan Ideas"
 bogelik_ideas_start: "Italyan Traditions"
 bogelik_ideas_bonus: "Italyan Ambitions"
 roman_awakening_islamic: "Islamic Awakening of Rome"
 roman_awakening_islamic_desc: "With the arrival of the Alaiturco in vast numbers to the heartland of the Empire, we have been ushered into a golden age of Islam within Rome. With the destruction of the ancient pagan pontiff, the al-Bayt Allah forged in its place, we saved the Romans from millenia of decay."
 roman_semetic_style: "Roman-Semetic Style"
 roman_semetic_style_desc: "The last century has seen a boom of infrastructurial innovation, with a seemingly endless breadth of Islamic architecture waiting to inspire us and be incorporated within the rich heritage of our own historical style."
 italy_land_of_innovation: "Land of Innovation"
 italy_land_of_innovation_desc: "Our innovativeness extends far beyond our architectural style and artwork alone. Information from all across Eurasia is bound to eventually find itself within the Mediterranean onto our doorstep, giving us a robust amount of philosophical traditions and innovative science to be able to catalyze, so we may be at the very forefront of new ideas."
 italy_commerce_of_germania: "Commerce of Germania"
 italy_commerce_of_germania_desc: "Situated directly south to the vast Die Thiota Reichien, the Germanic speaking faithful often trade with their heathenous northern cousins, providing for us many different metals, furs, and other goods we seldom can produce in any meaningful quantity. This status quo has encouraged us to invest more heavily into our merchantile class to better take advantage of the breadth of the Germanic trade network."
 rebuilding_roman_cities: "Rebuilding Roman Cities"
 rebuilding_roman_cities_desc: "Through conquest and great loss, many shining jewels of the Empire have been lost to barbaric forces. We must maintain the shining roads and structures of Rome in all the land we come under control of, and build new ones in their likeness, to restore the land to its former glory."
 caliphial_arms: "Caliphial Arms"
 caliphial_arms_desc: "The weaponry of the Caliphate's many subjects are uniquely innovative, built to overpower the rudimentary equipment of our neighbors. May the barbarians of Europe tremble at our might!"
 protecting_rum: "Protecting Rome"
 protecting_rum_desc: "Rome has been incredibly important to those truest to Allah and Muhammad in the last century. Our illuminated philosophical traditions, perfected by the Aal al-Bayt of Rome, must be protected."
 assyrian_ideas: "Assyrian Ideas"
 assyrian_ideas_start: "Assyrian Traditions"
 assyrian_ideas_bonus: "Assyrian Ambitions"
 legacy_of_mesopotamia_invaders: "Legacy of Nomadic Invasions"
 legacy_of_mesopotamia_invaders_desc: "From the very beginning, Mesopotamia has been ravaged by barbarian invasions every few centuries, from the ancient occupations spoken of in legend to the invasions of the Mongols, Arabs (though they were expelled) and Iranians. So after so much time it only makes sense that tactics designed to repel horseback warriors were properly introduced into Assyrian tactics. The main way we Assyrians fight back against such things is via the reintroduction of an ancient military tactic, the system of Spear, Shield and Bow. Through this system all archers, who otherwise would be vulnerable are protected by men of spear and shield. Using this the power of the cavalry charge is lessened and return fire can be issued accordingly. In later eras this tactic was reformed to make use of enslaved or indentured shield bearers who protect musketeers from enemy charges and return fire."
 syriac_mysticism: "Syriac Mysticism"
 syriac_mysticism_desc: "The relationship between Manicheans and Syriacs has been tumultuous at worst, but almost romantic at best. Exchange of ideas and tradition has given rise to mysticism among the Syriacs of Assyria, simultaneously encouraging the Manichaeans of Assyira to worship Jesus and other important Syriac figures, greatly increasing the likelihood that the Assyrian community will convert to our religion as a whole.\nYearly Darkness: §G-1§!"
 assyrian_bishop_council: "Bishop Councils"
 assyrian_bishop_council_desc: "The Christian 'Mirs of Assyria harken back to the administrative divisions created by the Sassanid Empire, guaranteeing the religious freedoms to the few regions of Assyria dominated by Christians. These 'Mirs would become closely aligned to the Patriachs of the faith and the Holy See of Sur'ia, also providing a home for many of the wayward Christians that lived across the Sassanid Empire. With the slow growth of the faith came new Bishops and Patriarchs, who themselves formed councils harkening back to when Christianity looked as though it might become dominant. These councils also harken back to the time of the Judges, in that they help to resolve local issues with justice and faith."
 assyrian_legions: "Legions of Assyria"
 assyrian_legions_desc: "As we are surrounded by nations hostile to the word of Christ it is imperative that we are well prepared for war, thus even the priests encourage young men to join the army especially when its ranks are not filled. The Assyrian legions march on, their numbers fighting the enemies of Assyria."
 assyrian_heirs_of_empire: "Heirs of an Empire"
 assyrian_heirs_of_empire_desc: "Our heritage can be traced far back within the holy texts, telling us that we once ruled a mighty empire stretching from Egypt to the Caucuses to Iran and throughout our home Region. This old nation, which did not live under Christ as we do now partook in the practice of deportation. While we would never be so crass as to do as they did we do partake in similar practices, dispersing pesky minority groups throughout our empire so that we may Assyrianize those under our dominion. This shall make our entire realm far more stable and unified."
 influence_of_satrapies: "Influence of the Satrapies"
 influence_of_satrapies_desc: "Being that Assyria was formerly divided into its own satrapies, and our shared heritage with the Iranian empires, it only makes sense that similar practices might be employed by a resurgent Assyria. However we are not Iranians, we do not bow to their gods nor speak their tongue for more than trade. Thus Assyria's vassals are not as long lasting as Iran's - we intend to eventually incorporate them all."
 might_of_ninos: "Might of Ninos"
 might_of_ninos_desc: "Ninos Ephremid was a military engineer born in Eshnunna in the late 1500s. Famed for his artillery tactics, which he used primarily to rain the wrath of God upon Assyria's enemies. His tactics inspired many other regiments, who took to using the power of cannons on the battlefield to great effect, thus the cannons of Assyria became feared enemies and desired allies across the region."
 herulian_ideas: "Herulian Ideas"
 herulian_ideas_start: "Herulian Traditions"
 herulian_ideas_bonus: "Herulian Ambitions"
 masters_of_the_herulian_isles: "Masters of the Herulian Isles"
 masters_of_the_herulian_isles_desc: "For centuries, the Heruli have ruled their namesake isles, maintaining a naval empire with considerable influence in the North Sea. The modern Nauling dynasty is named after the first King Nauling, who unified the Heruli in a grand conquest of the shores along the Baltic Sea, creating for his lifetime a massive empire that would lay the foundation for the expansion of the Wærgenga into the Baltic and Pommeranian coasts."
 the_nauling_kingdoms: "The Nauling Kingdoms"
 the_nauling_kingdoms_desc: "Andonnoson, named after his father who ruled the Herulian Isles, grew hungry to prove his worth and rule at a young age. Inserting himself into the affairs of the raiding Norse of the Saxon coast, he would find his opportunity in the Saxon princes' affairs - using temporary alignment with Celle to bring Verden and Hamburg to heel, securing their position under his rule before moving against Celle. With Andonnoson's brother on the Herulian and Cimbrian thrones, we have created a coalition of like-minded Nauling kingdoms to exert our influence across the North Sea and Germania."
 keep_waergenga_off_sea: "Guarding the Baltic Sea"
 keep_waergenga_off_sea_desc: "The Waergenga represent a vast polity now. Once an elite and very Norse group of warriors, the legend of their deeds has disseminated into the culture of the local Slavs, intermixing their ideas into what is arguably a Slavic religion. We must prevent their Norse-Slavic hybridization from influencing the isles. Should we fall, it seems doubtful that any other Scandinavians could stop the Waergenga invasions."
 maintaining_tradition: "Maintaining Tradition"
 maintaining_tradition_desc: "The Gods have made their presence clearly known through the ages, protecting us from invasions from monstrous forces and ancient, long defeated beasts. To give up our belief for some foreign Gods would be a laughable thing. We will fight to the last man in defense of our traditions."
 center_of_north_sea_trade: "Center of North Sea Trade"
 center_of_north_sea_trade_desc: "Having complete control over the passages that connect the North Sea to the Baltic, we have one of the rare positions to simply make incredible profits off of our geographical position. We should encourage and divert more trade through here so as to best take advantage of the circumstance."
 the_news_of_vinland: "News of Vinland"
 the_news_of_vinland_desc: "The news of Vinland has encouraged and invigorated our population to explore and venture to new, faraway lands like never before. As less of our population emigrates to the east, where we hold no influence, they are hungry to travel west, under colonial projects that we control."
 freethinkers_of_outer_isles: "Free-thinkers on the Outer Isles"
 freethinkers_of_outer_isles_desc: "Our large, strewn about thalassocracy gives our people plenty of opportunity for isolation, even on the scale of communities and islands, especially our holdings deep in the Baltic Sea. While this can be a problem at times, their unique ideas provide for us plenty of innovative inspiration."
 wylfinge_ideas: "Wylfinge Ideas"
 wylfinge_ideas_start: "Wylfing Traditions"
 wylfinge_ideas_bonus: "Wylfinge Ambitions"
 legacy_of_the_wolf_clan: "Legacy of the Wolf Clan"
 legacy_of_the_wolf_clan_desc: "The Wylfings are a long standing dynasty going back into the Heroic Age, having carved a proud kingdom based in strength and courage. Having fought off countless efforts at conquest, the Wylfings have created for themselves one of the strongest and more stable fighting forces on the peninsula."
 greatest_of_norse_royalty: "Greatest of Norse Royalty"
 greatest_of_norse_royalty_desc: "As a part of our legendary status and long-standing stability, we are viewed as the only ones who could possibly rule our domains. As it has always been, our success depends on our rule."
 heirs_to_scandinavia: "Heirs to Scandinavia" 
 heirs_to_scandinavia_desc: "Even beyond the lands of the Wylfinge, what King is better fit to rule their land in Scandinavia than a Wylfing? It is evident that we are truly unmatched amongst the Norse."
 seizing_north_sea_trade: "Seizing North Sea Trade"
 seizing_north_sea_trade_desc: "Beyond the Scandinavian peninsula, the waters and their trade are dominated by the Heruli. We should invest heavily in privateering efforts to try and break apart their monopoly that they've enforced on us."
 all_power_to_wylfings: "All Power to the Wylfings"
 all_power_to_wylfings_desc: "It is clear that we are likely one of the only Godly dynasties left on the planet. We should cut apart the privileges that corrupt, vain men grasp onto, as these are anchors that weigh our illustrious rulers down deeply."
 palmyrene_ideas: "Palmyrene Ideas"
 palmyrene_ideas_start: "Palmyrene Traditions"
 palmyrene_ideas_bonus: "Palmyrene Ambitions"
 syr_eunuchs: "Administrative Eunuchs"
 syr_eunuchs_desc: "From its place under the boot of many empires to its modern incarnation Palmyra has ended up with an effective administrative body maned primarily by orphans and slaves turned Eunuchs, these men serve as representatives of lords and the ruler but have no other ties besides and so can be given considerable autonomy."
 syr_tribal_levies: "Tribal Levies"
 syr_tribal_levies_desc: "Palmyra has a long and stable relationship with the nomads and tribes which inhabit its swaths of desert, this allows for the raising of relatively cheap and effective cavalry for its armies."
 syr_resident_scholars: "Resident Scholars"
 syr_resident_scholars_desc: "Given our relative neutrality, Palmyra provides one of the best places for a foreign scholar to flee to or take residence in whenever some great upheaval or strife occurs in the Hellenic world, leading to more competition amongst themselves and thus lower costs for maintaining their advice as administrators and lords of the realm."
 syr_gateway_mediterranean: "Gateway to the Mediterranean"
 syr_gateway_mediterranean_desc: "Besides the straits of Balik, Palmyra remains along the quickest route from Iran to the Med, meaning Palmyrene merchants have considerable influence in those regions and generally abroad. This is compounded by the historical dominance of Palmyrene Merchants in these regions. "
 syr_foreign_wives: "Foreign Wives"
 syr_foreign_wives_desc: "Given the ancient heritage of Palmyra, Islamic Influence and the diverse selection of foreign kingdoms there comes the tradition of taking foreign wives, coming with this has come laws allowing more possible heirs to be chosen from the offspring of these foreign wives and concubines."
 syr_valley_tombs: "Valley of Tombs"
 syr_valley_tombs_desc: "Since the Hellenistic Period of Palmyra as a Seleucid subject the Valley of Tombs near Palmyra has held many dead who have ruled or maintained important roles in the great city. The valley is dotted with towers which serve as their tombs, their walls lined with murals depicting their great exploits and righteous deeds. Since the conversion to Manicheanism this area has also served as a holy site with local worship of various Saints and spirits being held within it."
 syr_hellene_education: "Hellenic Education"
 syr_hellene_education_desc: "Links between the Hellenic world and Palmyra are deeply historical, with the nation being deeply influenced by their culture. In the middle of the early modern period this led to the foundation of more specialised education for the elites, allowing for more effective diplomacy and greater religious coherence.\nYearly Darkness: §G-1§!"
 qahtani_ideas: "Qahtani Ideas"
 qahtani_ideas_start: "Qahtani Traditions"
 qahtani_ideas_bonus: "Qahtani Ambitions"
 qaht_iranized_arabs: "Iranized Arabs"
 qaht_iranized_arabs_desc: "The Qahtani trace their descent to the Southern Arab peninsula, but the early Nisrids carved out a delicate tributary relationship with the Sassanid Empire, and with them we maintained our traditions in the wake of Muhammad's conquests. This brought us closer into the Iranian world than ever before, having a deep and permenant impact on our language, culture, and faith.\nYearly Darkness: §G-1§!"
 qaht_knowledge_of_assyrians: "Assyrian Knowledge"
 qaht_knowledge_of_assyrians_desc: "Our Assyrian neighbors have a rich history of nation-building and innovation, and these traditions and ideas have organically spread to us as well. We should wholeheartedly embrace the legacy of the Assyrians and the vast empires they created."
 qaht_travelling_arab_desert: "Travelling the Deserts"
 qaht_travelling_arab_desert_desc: "Having a long tradition of knowing our southern deserts have lead us to be able to traverse them quickly and effectively."
 qaht_under_great_powers: "Under Great Powers"
 qaht_under_great_powers_desc: "We are sleeping underneath some massive giants. The modern Nucyaxarids operate much differently from the Sassanids of old, but we should try our best to maintain a friendly relationship regardless."
 qaht_steady_recruitment: "Steady Recruitment"
 qaht_steady_recruitment_desc: "The waters of the Tigris, Euphrates, and the Gulf still provides us with more than enough irrigation and fishing to be able to build the foundations for a great empires, even if the waters don't rush as powerfully as they once did."
 qaht_mesopotamian_infrastructure: "Mesopotamian Infrastructure"
 qaht_mesopotamian_infrastructure_desc: "Many great empires have risen and fallen on these bountiful lands. This legacy has provided with us a foundation to be able to quickly rise and found for ourselves our own grand empire."
 qaht_iranized_semetic_empire: "An Iranized Semetic Empire"
 qaht_iranized_semetic_empire_desc: "The great Semetic plurality has mostly separated between Mani and Muhammad. Perhaps just some classic Iranian empire building is what's needed to finally unite the Aramaic, Assyrian, and Arabic peoples."
 taurus_march_ideas: "Karduene Ideas"
 taurus_march_ideas_start: "Karduene Traditions"
 taurus_march_ideas_bonus: "Karduene Ambitions"
 taurus_constant_war: "Constant Warfare"
 taurus_constant_war_desc: "Whether suzerain to Rome, Pontus, Armenia, Assyria, Iran, or Cappadocia, our suzerains will happily drag us into whichever conflict they choose, further dragging us away from the prosperity we so desperately wish to build for ourselves, but our people have learned to bounce back quickly from these setbacks."
 taurus_conflux_traditions: "Conflux of Traditions"
 taurus_conflux_traditions_desc: "Here among the southwestern Taurus, so many different empires have left their mark upon us. As a result, we have a broad understanding of different peoples and have become very tolerant as a result."
 taurus_stark_religious_borders: "Stark Religious Boundaries"
 taurus_stark_religious_borders_desc: "We lie on the boundaries between peoples of vastly differing religious traditions, and we have learned how to respect them, and more importantly, get what we want from them."
 taurus_hellenic_philosophy: "Hellenic Philosophy"
 taurus_hellenic_philosophy_desc: "The Hellenes left us with a rich philosophical tradition from which we can thoroughly draw from to create new and exciting ideas."
 taurus_iranian_administration: "Iranian Administration"
 taurus_iranian_administration_desc: "We have learned from the best on how to manage our realm, and as it grows in size we find ourselves more than capable of handling the pressure."
 taurus_armenian_defenses: "Armenian Defenses"
 taurus_armenian_defenses_desc: "We needn't go far to learn from the ancient Kingdom of Armenia and their vast mountain fortresses. We can adapt the same ideas to the Taurus mountains and create an impenetrable wall for any potential invaders."
 taurus_assyrian_tactics: "Assyrian Tactics"
 taurus_assyrian_tactics_desc: "The Assyrians know well how to navigate the flat combat beyond the mountains, and we should learn from them to remain well-protected even well beyond our fortresses and grow all our lands to great prosperity."
 jum_huria_ideas: "Jum Huriya Ideas"
 jum_huria_ideas_start: "Jum Huriya Traditions"
 jum_huria_ideas_bonus: "Jum Huriya Ambitions"
 jum_huria_mediterranean_tradition: "Mercantile Tradition"
 jum_huria_mediterranean_tradition_desc: "We were borne from the trade networks connecting the peoples around the Mediterranean, Sahara, and the Indian and Pacific Oceans, mastering trade in all kinds of places."
 catalyzing_early_democracies: "Discovering Early Democracies"
 catalyzing_early_democracies_desc: "The traditions created by the first Muslims, to share power amongst the community in deciding their leadership, are beget by other ancient forms of representation. We should catalyze the history of republics across the world to perfect Muhammad's preferred form of governance."
 al_iinsania: "al-Iinsania"
 al_iinsania_desc: "al-Iinsania, meaning humanism, is an important aspect of our government's function. Even for the Ash'ari, the expansion of thought in this field would be a positive inclusion to the grammatical and theological study that is currently centerpiece in academia."
 jum_huria_regional_connectivity: "Regional Connectivity"
 jum_huria_regional_connectivity_desc: "We are the glue that binds our neighbors together, producing the finest diplomats and merchants in the area."
 jum_huria_fleet: "Fleet of the Republic"
 jum_huria_fleet_desc: "With an emphasis on our own nationalized naval armada, we will be able to secure the best deals for our guilds and trade companies across the world."
 proper_quranic_dissemination: "Islamic Reform"
 proper_quranic_dissemination_desc: "We are faithful followers of Allah, and we will make sure it is His true beliefs that are carried into this new world."
 jum_huria_meritocratic_military: "Military Meritocracy"
 jum_huria_meritocratic_military_desc: "Our weak nobility affords us the ability to make only the brightest and smartest of our people into generals, rather than as a reward for blood."
 fultons_ideas: "Fulton's Ideas"
 fultons_ideas_start: "Fulton's Followers"
 fultons_ideas_bonus: "Fulton's Legacy"
 fultons_strong: "Strength"
 fultons_strong_desc: "Fulton is well renowned amongst the Latin and Saxain world for his extraordinary strength. Fulton's idea is to serve as a symbol to his warriors to chase physical prowess above all things."
 fultons_vengeance: "Vengeance"
 fultons_vengeance_desc: "Fulton's idea is to exact vengeance upon the petty King of Wessex and the Latin counts, for their constant warring for dominance is what tore Fulton from his seat of nobility in Runcwunda."
 fultons_charm: "Charm"
 fultons_charm_desc: "Charm is the only thing that kept Fulton's hold on power stable, for he amassed a mass of Saxain refugees fleeing the destruction of their lands. Fulton thinks his virtues of charm and guile should spread to his people to amass an able group that can serve as diplomats and spies."
 fultons_apathy: "Apathy"
 fultons_apathy_desc: "Fulton doesn't really care about religion. Sure, he'll cut a lamb to do well in battle, but it's nothing serious. Who cares if his subjects do something else, so long as they pay their taxes and can hold a sword."
 fultons_ethic: "Ethic"
 fultons_ethic_desc: "Fulton's idea is that everybody should work just a little bit harder. There's money to be made, and Fulton needs to rebuild his wealth!"
 fultons_paternity: "Paternity"
 fultons_paternity_desc: "Most of Fulton's followers have been with him through many trials and tribulations, and at this point he shares a close connection to his soldiers. Fulton thinks this military kindred spirit should succeed him beyond death and become our tradition."
 fultons_fears: "Fears"
 fultons_fears_desc: "Fulton fears to lose the land that we have gained, to be cast asunder yet again. What if the next generation doesn't have a Fulton that can bring them together through such a dark hour? Fulton thinks that his people should be wary of foreign influence and be constantly mindful of the dangers that they pose."
 yehudah_ideas: "Yehudah Ideas"
 yehudah_ideas_start: "Yehudah Traditions"
 yehudah_ideas_bonus: "Yehudah Ambitions"
 surviving_roman_dark_age: "Surviving the Roman Age"
 surviving_roman_dark_age_desc: "The tyranny of Rome was the darkest age of Elohim's Kingdom since the Assyrians. The pagans swept over Yehudah and tyrannized its people for 90 long years, destroying the Second Temple before being pushed out by a local alliance that spured to our aid. We will never forget the chaos and destruction the Romans wrought upon our lands."
 judean_golden_age: "Judean Golden Age"
 judean_golden_age_desc: "In the years since the decline of Rome, we were once again under existential threat by the rise of the Islamic Caliphates, a series of vastly powerful entitles with land across Arabia, North Africa, and Europe. Thankfully, after the defeat of the Rashidun Caliphate by a Aramaic-Iranian coalition, the Islamic caliphs mostly sought to expand elsewhere. With the rise of the Hanafiyyah Caliphate, however, we have entered a new golden age under their protection, giving us more safety in the world than we have ever had before."
 the_hanafiyyah_marriage: "The Hanafiyyah Marriage"
 the_hanafiyyah_marriage_desc: "Our Hanafi bretheren hold a strange, heathenous cosmology, but they are followers of Abraham nonetheless and have deeply glorified our ruling dynasty, intertwining our dynastic heritage from Abraham with their own through many diplomatic marriages. They are like our extraordinarily strong, yet younger brother, so an ambivalence to their strange habits is a permissable circumstance."
 jewish_great_builders: "Great Builders"
 jewish_great_builders_desc: "We have a long, storied history of spectacular architectual minds who have had a powerful impact on the development of our infrastructure, even extending our influence well beyond our borders. We should continue to encourage new architects to continue this tradition well into the future."
 jewish_defensive_tradition: "Defensive Tradition"
 jewish_defensive_tradition_desc: "We have a strong connection to the land, and we'll be damned (figuratively of course as we are the chosen people) if some next-generation Roman Empire wannabe comes in here and makes a stake at our domain. This land has been divinely ordained to us for all eternity."
 jorvik_ideas: "Jórvik Ideas"
 jorvik_ideas_start: "Jórvik Traditions"
 jorvik_ideas_bonus: "Jórvik Ambitions"
 jorvik_raiding_heritage: "Raiding Heritage"
 jorvik_raiding_heritage_desc: "Since first landing on the Isles, the petty Kings of Jórvik have made a tradition of paying a visit to our neighbors' coastal villages, taking their wealth and peasants for ourselves. We should remind our neighbors about our glorious tradition whenever possible."
 jorvik_hjallic_ties: "Hjallic Ties"
 jorvik_hjallic_ties_desc: "The King of Hjalland has been a steadfast friend, and was once our suzerain during their rule over the Oyggjarnar. While independence is sure a great thing, we should maintain our friendship as long as it remains convenient to us."
 jorvik_inglis_syncretism: "Inglis Syncretism"
 jorvik_inglis_syncretism_desc: "Our Inglis subjects have some interesting religious habits and ways of looking at the world. One particularly interesting deity to us is the Goddess of the Wheel, Habetrot, whose turning of the wheel of fate continues the cycle of life and death. She has become a popular symbol amongst the Norn nobility of Jórvik in our troubled era.\nCan select §GHabetrot§! as a new deity: she §Rreduces monarch lifespan§! and §Gincreases heir chance§!."
 jorvik_north_sea_competition: "North Sea Competition"
 jorvik_north_sea_competition_desc: "The North Sea are cutthroat waters full of pirates and reavers (such as ourselves). To maintain dominance over the waters means great wealth for our kingdom."
 jorvik_settlements: "Settlement Plans"
 jorvik_settlements_desc: "We should take advantage of our ties with fellow Norsemen on the Isles and in Scandinavia and encourage further Norse settlement in our territories, and perhaps these migratory connections will serve us well in future overseas expansions."
 jorvik_overseas_expansion: "Overseas Expansion"
 jorvik_overseas_expansion_desc: "We are constantly looking to expand our influence into new regions in our search for wealth and glory. We should seize our stake in the legendary Austlands beyond our grand ocean, and be the first to find and lay claim to old Vinland."
 jorvik_suzerainty: "Jórvik Suzerainty"
 jorvik_suzerainty_desc: "Our long standing independence and growing influence in the world has made the grand city of Jórvik the cultural center of the Isles, home to the lost wealth of untold fallen empires. We stand well-deserving to be the sole-suzerains of the Isles."
 wasiliyah_ideas: "Wasiliyah Ideas"
 wasiliyah_ideas_start: "Wasiliyah Traditions"
 wasiliyah_ideas_bonus: "Wasiliyah Ambitions"
 wasiliyah_almohad_resistance: "Almohad Resistance"
 wasiliyah_almohad_resistance_desc: "The Almohad movement, much like their Almoravid predecessors, are a constant threat to the stability of our traditions. They seek to destroy our philosophical values in the name of their misguided interpretation of the holy scripts. We must be constantly vigilant of them and those like them to maintain our religious freedoms."
 wasiliyah_wave_conservatism: "Conservative Wave"
 wasiliyah_wave_conservatism_desc: "Our religious tradition and interpretation of the Quran are some of the oldest in the region. As Islam is constantly reinvented around us, we look inwards to try and maintain the purity of thought and form that makes us distinct and so close to God."
 wasiliyah_amazigh_pride: "Amazigh Pride"
 wasiliyah_amazigh_pride_desc: "Called Berbers by the barbarians of the north, the Wasiliyah sect of Islam is represented exclusively by Amazigh traditions and languages, and we are the true descendants of the Mutazila movement that once gripped al-Misr before the Haladri expansion. While some forms of its ideals were taken by al-Rumi, they simply used the framework as an excuse to pervert Muhammad's message into a reformation of the Roman god-king tradition."
 wasiliyah_ancient_heritage: "Ancient Heritage"
 wasiliyah_ancient_heritage_desc: "We are the heirs of Carthage and Maurentia. We should create a prestiguous empire of their likeness, but under the glory of God."
 wasiliyah_trading_hubs: "New Trading Hubs"
 wasiliyah_trading_hubs_desc: "As our wealth and influence expands beyond the Maghreb, especially beyond the Sahara and in the Atlantic, we must encourage our people not only to seek fortune in our name, but also to provide stable places of rest and networks to trade amongst each other in these new faraway regions. With this new influence we can truly become a world power."
 wasiliyah_divine_right: "Divine Right"
 wasiliyah_divine_right_desc: "Our interpretation of the religious texts are unmatched in scrutiny and discretion. All has been taken accounted for - our translations are the unadultered word of God."
 wasiliyah_lively_debates: "Lively Debates"
 wasiliyah_lively_debates_desc: "With our large corpus of texts in hand, we take to the battleground of wisdom against our faithful adversaries. Our well-trained religious scholars prepare their entire lives in prestigous schools to help others see the truth of our word."
 eransahr_ideas: "Eransahr Ideas"
 eransahr_ideas_start: "Eransahr Traditions"
 eransahr_ideas_bonus: "Eransahr Ambitions"
 eransahr_thatta_destruction: "Destruction of Thatta"
 eransahr_thatta_destruction_desc: "While the Sassanid dynasty managed to hold steadfast against a series of invasions from the Caucasus, Arabia, Mesopotamia and Anatolia throughout their tenure as Shahanshahs from the 2nd to 13th centuries, the rapid and devastating invasions of the Mongols would ultimately be their undoing. Having slowly expanded through the diplomatic network of northern India, the Sasanian court ultimately would move from Ctesiphon to Thatta, further cementing the infrastructure of the state southwards. However, the open steppes north of the Indus valley were an easy target for the conquests of the Mongol invaders, who would inherit the eastern portion of the Sasanian empire./n As for the west, the vacuum left by their Sasanian overlords gave the powerful Armenian satrap an opportunity to support a more cooperate dynasty of the neighboring Median nobility. It was in the chaos of this period that the Axarids resurged - while some dissidents may claim the impossibility of the survival of such an ancient dynasty, such statements are unheard of in the royal court."
 eransahr_cultural_epicenter: "Cultural Epicenter"
 eransahr_cultural_epicenter_desc: "Despite the great losses the Iranian peoples have faced in the destruction brought about by the end of Iranian suzerainty over most of the Middle East and India, in our resurgence we have quickly regained our vast cultural influence, and the massive Iranian diaspora created by the Mongol invasion, commonly referred to as the Ewarzdagr, leaves us with massive diplomatic weight across the old world."
 eransahr_military_resurgence: "Military Resurgence"
 eransahr_military_resurgence_desc: "While we have most certainly inherited the diplomatic strategies of the preceding Iranian empires, it was the slow and steady decline of the Sasanid military that had a major role to play in the Empire's ultiamte defeat at the insurgent Mongol Horde. We will learn from the mistakes of our forerunners and build for the Empire a strong and well-disciplined military force that can stand testament to any future horrors that manifest themselves on our horizons."
 dolgorukov_ideas: "Dolgorukov Ideas"
 dolgorukov_ideas_start: "Dolgorukov Traditions"
 dolgorukov_ideas_bonus: "Dolgorukov Ambitions"
 dolgorukov_bloodthirst: "The Bloody Rise to Power"
 dolgorukov_bloodthirst_desc: "Rodoptrs hailing from Mazovia, the Dolgorukovs gained power over the Severians in a brutal display of combat against the Severian chieftans for the glory of Rod. The Dolgorukovs now wield absolute power as the wielders of Rod's strength."
 power_to_the_rodamil: "Power to the Rodamil"
 power_to_the_rodamil_desc: "The nobility bend to the will of the Rodamil, for they are the descendants of those chosen to be ruled."
 dolgorukov_bleeding_foes: "Bleeding Foes"
 dolgorukov_bleeding_foes_desc: "Our enemies bleed in our vast empty forests, never to see combat and never to return home."
 brutal_severian_winters: "Brutal Severian Winters"
 brutal_severian_winters_desc: "You may have survived the summer, but fall is upon us."
 serfdom_enforced: "Serfdom Enforced"
 serfdom_enforced_desc: "While the rights and ambitions of the lower classes are realized across the world, we have enforced serfdom. Nobody can stand to the royal family."
 wooden_forts: "Wooden Forts"
 wooden_forts_desc: "The cruel twist of fate, to finally reach your goal only to find nothing. There is no salvation for you in these lands."
 rodamils_empire: "Rodamil's Empire"
 rodamils_empire_desc: "Every military victory makes our suzerainty over the world ever closer to being guaranteed."
 hayastani_ideas: "Haykakan Ideas"
 hayastani_ideas_start: "Haykakan Traditions"
 hayastani_ideas_bonus: "Haykakan Ambitions"
 hayastan_renowed_mountain_riders: "Renowed Mountain Riders"
 hayastan_renowed_mountain_riders_desc: "At many of the flatter reaches of the Armenian highlands, the alpine grasslands have fueled our survival. Its grasses have nourished the cows and horses of the state. Throughout centuries of horse breeding we have not forgotten the power of having superb cavalry - and in this era of opportunity especially we must use our thunderous cavalry divisions to sew chaos amidst our foes."
 hayastan_legacy_of_queen_erato: "Legacy of Queen Erato"
 hayastan_legacy_of_queen_erato_desc: "Queen Erato was the last in name of the Artashesean royal line, though her blood lives on in the modern Arascid dynasty. Beset by conquerors on both sides, hungry to secure their legacies, Armenia was carved up between the Roman and Sassanian empires. Erato's great-uncle, K'sifares I, ruled Armenia while her father ruled the Upper Levant under Roman agreement. Deeply unpopular, K'sifares would face his end upon the arrival of the Pontic King, Mithridates VII, who had been called to Tigranocerta by K'sifares himself, and decided to execute him at the behest of the cityfolk and noblemen. But Mithridates left his Pontic son on the Armenian throne - propelling Erato's father into an attempted conquest of Armenia, an adventure that would bring the demise of Erato's father and brother. As the last living noble of Artashesean blood, Erato would undermine the Romans to bring union between herself and Phraates I, the Iranian prince that lay claim to Armenia. This new Iranian-Armenian dynasty brought unity amongst the Armenians and support from the Iranians, allowing the swift expulsion of the Pontic pretender - and this would secure what has been to this day an everlasting peace between Hayastan and the Shahanshah. To this day, Queen Erato is fondly remembered as the mother of all modern Armenian kings, and a figure of the nation itself."
 hayastan_savior_of_the_fires: "Savior of the Fires"
 hayastan_savior_of_the_fires_desc: "Our massive, evergrowing ally had become massive in size, having extended itself well beyond expected reach deep into the Indian subcontinent. As we secured the eternal safety of Iran's western border, it continued to look further and further east, its capital even moving faraway to Thatta, at what at the time was the center of the Iranian empire. But when the Mongol Empire encroached upon Iran, with its northerly vassals having become turncoats, its new center was laid to waste. Our nation moved quickly to secure the safety of our mission - humanity's mission - to triumph against the darkness within us and around us, by protecting the holiest of places on the mortal plane within the west of the Iranian empire - the holy fires. Given our history of cooperation, it was with little tension that we were able to work with the Median nobility in securing their future, understandably given the horror stories coming from Thatta. Through the chaos, we empowered the 'return' of the ancient Axarid Median line, with well-documented evidence showing how the royal line survived. These new Axarid kings are in our eternal debt, though our actions were for the Light."
 hayastan_feeding_the_king_of_kings: "Feeding the Shahanshah"
 hayastan_feeding_the_king_of_kings_desc: "Bringing back the Empire that once threatened our very survival doesn't come without a cost. We must maintain our good-graces, especially should the Iranian empire continue to grow and expand into its pre-Mongol borders. While such a circumstance could create a lopsided relationship, it secures us from any sort of nomadic resurgence that could possibly threaten us from the east."
 hayastan_taming_anatolia: "Taming Anatolia"
 hayastan_taming_anatolia_desc: "The Hellenic kings have always been a thorn on our side - seeking our pastures and mountains as their glorified borderland. But this type of attitude goes both ways - their steep coastlines would make for an excellent borderland as well!"
 hayastan_beyond_the_kings: "Beyond Kings and Kings of Kings"
 hayastan_beyond_the_kings_desc: "Perhaps we should look beyond what is known - venture forth bringing light into the dark unknown. For if our message is not spread, we may risk decay and stagnation - tools used by the envious dark to wear on the infinitely stronger light."
 hayastan_center_of_confluence: "Center of Confluence"
 hayastan_center_of_confluence_desc: "We may very well be some of the last remnants of the ancient flourishing cultures of Anatolia and the southern Caucasus. In the stead of our lost cousins are peoples from all sorts of origins across the world. It would be in our best interest to use our multicultural knowledge to share and trade boundless ideas and become powerful players in the emergent realms of industry and finances."
 kasrashi_ideas: "Kasrashi Ideas"
 kasrashi_ideas_start: "Kasrashi Traditions"
 kasrashi_ideas_bonus: "Kasrashi Ambitions"
 kasra_eirun_friendship: "Friends of al-Iir"
 kasra_eirun_friendship_desc: "Since the Saulifid dynasty has taken root in the southerly ports of Ireland, our two dynasties have facilitated a stranglehold over the trade network of Western Europe. So long as our friendship stands, none can overwhelm us."
 kasra_popular_leadership: "Popular Leadership"
 kasra_popular_leadership_desc: "Our dynasty had its beginnings in popular revolt by the commonfolk, aspiring against the rule of Christian tyrants, violent Sunni and turncoat Ashabi. And as deep as the influence of the imams may be, their decentralized authority leaves them weak. The powers that be within the state are muted in their ability to rule against our wishes."
 kasra_tumultuous_borders: "Tumultuous Borders"
 kasra_tumultuous_borders_desc: "The constant warring on the peninsula leaves the impression that a life out on the seas may even be calmer than a life on the mainland. Regardless, it has left us with a burgeoning population that may need some investment to become seaworthy, but their labors can be useful anywhere."
 kasra_new_lands: "New Lands"
 kasra_new_lands_desc: "The yearning desire to travel is becoming ever more embroidered in our populace as we take on and assimilate successive generations of migrants, though this yearning has always existed in our sailors. Perhaps with recent advancements in shipbuilding techniques, it will become increasingly possible for our sailors to bring forth willing adventurers to disembark to new and exciting lands."
 kasra_military_standards: "New Military Standards"
 kasra_military_standards_desc: "As our influence begins to exponentially expand into faraway lands, it has become increasingly apparent that we need to have well established military command structures that are capable of surviving outside the traditional line of command from the top down. Training at home to fight in the nation's name in faraway lands will serve us well to bring the best we have to offer on any battlefield."
 kasra_great_bounties: "Great Bounties Beyond"
 kasra_great_bounties_desc: "Gold... Allah has truly praised us for our dutiful ways. Our greatest strength, the Atlantic, has become the highway to a promised land of riches waiting to be taken."
 kasra_every_soldier_a_king: "Every Soldier a King"
 kasra_every_soldier_a_king_desc: "Are you a frusterated second son of a lesser noble, looking to etch out their name to be carved into the history books? With the proper backing, you too can conquer an American nation and become its tyrannical overlord! So long as you remember your Emperor and give your thanks to the treasure fleets, you too can live the luxurious life of royalty."
 kxaiae_ideas: "Kx'ai'âe Ideas"
 kxaiae_ideas_start: "Kx'ai'âe Traditions"
 kxaiae_ideas_bonus: "Kx'ai'âe Ambitions"
 kxaiae_bantu_origins: "Bantu Origins"
 kxaiae_bantu_origins_desc: "The Bantu origins of the early third era kx'ais gives us a few centuries of experience of governing larger, sedentary societies than our other Q'a Numi bretheren. It is our advancements in statehood and society that fueled the awakening of the Taa-Kwi, Khoe and Kung."
 kxaiae_insurgent_masters: "Insurgent Masters"
 kxaiae_insurgent_masters_desc: "For centuries, our ancestors fled in the wake of Q'a Numi expansionism, or risked being assimilated into their growing project. However our numbers were simply too great to be assimilated by any great degree, as in the Great Lakes where Bantus have become the rulers of the Q'a Numi world. Perhaps this marks the beginning of a great shift within the faith."
 kxaiae_new_qanumi: "A New Q'a Num"
 kxaiae_new_qanumi_desc: "Our philosophy and traditions are markedly different from those of previous Q'a Numi kx'ais, especially from the Saadzahi kx'ai and the second era kx'ais. Our practice marks the beginning of a shift of Q'a Numi society into a much more patriarchal and authoritarian structure - at least under our control. Some traditions simply have not translated as well as the faith has expanded northwards."
 kxaiae_northern_kurudis: "Northern Kurudis"
 kxaiae_northern_kurudis_desc: "We are the vanguard of the faith, the militants bringing our tradition to never before seen frontiers. Kaggen laughs at us from his position of opulence throughout the north, and we answer him with steel."
 kxaiae_language_standardization: "Language Standardization"
 kxaiae_language_standardization_desc: "Our bookkeeping abilities have significantly faltered over the past centuries. Constant phonetic changes, mostly resulting from the failure of second-language speakers to properly adapt to the plethora of additional phonetics required out of most Kunaa languages. Bookkeepers have been tasked to the painful task of bringing the language to its lowest common denominator in order to allow for access to literacy and proper speech throughout the kx'ai."
 kxaiae_saadzahis_rulers: "Saa Dzahi's Rulers"
 kxaiae_saadzahis_rulers_desc: "We have proven ourselves to be worth being regarded as the administrative and ruling class of the Q'a Numi civilization. Our leadership is unmatched and we have made ourselves known all throughout the Sub-Saharan world."
 kxaiae_war_against_the_world: "War Against the World"
 kxaiae_war_against_the_world_desc: "Kaggen's many faces mock us from every continent. It is time we sally forth and bring the power of the true gods to the world!"
 soisson_ideas: "Soisson Ideas"
 soisson_ideas_start: "Soisson Traditions"
 soisson_ideas_bonus: "Soisson Ambitions"
 ssn_knights_of_gaul: "Knights of Gaul"
 ssn_knights_of_gaul_desc: "A rich tradition of knighthood has existed in Gaul since the Middle Ages, borne originally out of the Fidemarx system. Even as the landscape of Gaul has vastly changed since its golden era, we carry on the legacy of a skilled caste of noble cavalry."
 ssn_elaborate_castles: "Elaborate Castles"
 ssn_elaborate_castles_desc: "We have carried on the Fidemarx tradition and expanded upon it to create many state of the art castle designs. Our understanding of forts and their inner working makes us exceptionally good at breaking into them, as well."
 ssn_weathering_the_germani: "Weathering the Germani"
 ssn_weathering_the_germani_desc: "The civil unrest and chaos that ensued in the 10th-11th centuries fractured and isolated the remnants of Rome's northern holdings, leaving us isolated from Rome proper. But the authority of Rome was consistently antagonistic to Christ's followers, and the growing Christian community in northern Gaul and Brittania was able to flourish as a result. It was in His grace that we persisted in this period, holding fast in our garrisons until the time came to sally forth with the support of the first Christian knights. It was with this kind of strategy that northern Gaul survived the barbari onslaught."
 ssn_soissons_churches: "Soissons' Churches"
 ssn_soissons_churches_desc: "Within the fortifications of Soissons many churches have been able to bloom. While the early churches of the Riothemite era are long gone, the last two centuries have seen the proliferation of many Téodolic churches."
 ssn_prolific_faithful: "Prolific Faithful"
 ssn_prolific_faithful_desc: "The church has maintained a strong presence in the local affairs of the people since the days of Téodol. Encouraging large families and productive lifestyles, this relationship has ultiamtely been a boon to the long-term stability of the nation."
 ssn_upgrading_roman_roads: "Roman Roads"
 ssn_upgrading_roman_roads_desc: "Many of the Roman roads have survived, and served as the foundational basis for our modern road networks. We take pride on our infrastructure as a testament to our dedication to God and how He has improved us compared to the other nayscent Roman states that continue to condemn the teachings of Christ."
 ssn_christian_connections: "Christian Connections"
 ssn_christian_connections_desc: "In this world of heathens, there is little reason on a personal level to distrust the other Christian communities. Our unity and faith are our strength - we can leave it to the clergymen to bicker over the greater detail."
 saxan_ideas: "Saxain Ideas"
 saxan_tier_2_ideas: "Saxain Ideas"
 saxan_tier_3_ideas: "Saxain Ideas"
 saxan_ideas_start: "Saxain Traditions"
 saxan_tier_2_ideas_start: "Saxain Traditions"
 saxan_tier_3_ideas_start: "Saxain Traditions"
 saxan_ideas_bonus: "Saxain Ambitions"
 saxan_tier_2_ideas_bonus: "Saxain Ambitions"
 saxan_tier_3_ideas_bonus: "Saxain Ambitions"
 saxan_mercenary_origins: "Mercenary Origins"
 saxan_mercenary_origins_desc: "Our first ancestors arrived on the island as mercenaries to the early Walsch Kings, and while many were given lands of their own, many returned across the sea to tell their families of the bountiful and weakly-defended islands just beyond the horizon, bringing many more to the isle as migrants."
 saxan_mercenary_origins_2: "Mercenary Origins"
 saxan_mercenary_origins_2_desc: "Our first ancestors arrived on the island as mercenaries to the early Walsch Kings, and while many were given lands of their own, many returned across the sea to tell their families of the bountiful and weakly-defended islands just beyond the horizon, bringing many more to the isle as migrants."
 saxan_mercenary_origins_3: "Mercenary Origins"
 saxan_mercenary_origins_3_desc: "Our first ancestors arrived on the island as mercenaries to the early Walsch Kings, and while many were given lands of their own, many returned across the sea to tell their families of the bountiful and weakly-defended islands just beyond the horizon, bringing many more to the isle as migrants."
 saxan_vassals_no_more: "Vassals No More"
 saxan_vassals_no_more_desc: "The first independent Saxain polities emerged out of the Hjallaw, though these were small counties centered around castles, and would mostly be suzerain to the Hjallish king and then later Brittonic and Armorican kings. During later Brittonic rule, the Romans would attempt to impose Christianity upon their Germanic subjects, though we would resist fiercly and these efforts were mostly only successful with the Eotar. No longer will we be subject to the whims of the pretenders, instead we will impose our own will upon them."
 saxan_vassals_no_more_2: "Vassals No More"
 saxan_vassals_no_more_2_desc: "The first independent Saxain polities emerged out of the Hjallaw, though these were small counties centered around castles, and would mostly be suzerain to the Hjallish king and then later Brittonic and Armorican kings. During later Brittonic rule, the Romans would attempt to impose Christianity upon their Germanic subjects, though we would resist fiercly and these efforts were mostly only successful with the Eotar. No longer will we be subject to the whims of the pretenders, instead we will impose our own will upon them."
