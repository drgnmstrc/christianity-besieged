 saxan_martial_education: "Martial Education"
 saxan_martial_education_desc: "Military education is important to not only the court but nobility as a whole, given the long history of conflict we have faced from our very arrival on the isles. This also creates increased competition amongst our military advisors and allows us the potential to hire greater minds."
 saxan_martial_education_2: "Martial Education"
 saxan_martial_education_2_desc: "Military education is important to not only the court but nobility as a whole, given the long history of conflict we have faced from our very arrival on the isles. This also creates increased competition amongst our military advisors and allows us the potential to hire greater minds."
 saxan_martial_education_3: "Martial Education"
 saxan_martial_education_3_desc: "Military education is important to not only the court but nobility as a whole, given the long history of conflict we have faced from our very arrival on the isles. This also creates increased competition amongst our military advisors and allows us the potential to hire greater minds."
 saxan_grander_fleets: "Grander Fleets"
 saxan_grander_fleets_desc: "The seas are still of paramount importance to us, they are our origin, they feed us, and it is on their choppy waves that we can control trade and defense the isles. More ships for mercantile and military purposes would both suit us nicely."
 saxan_grander_fleets_2: "Grander Fleets"
 saxan_grander_fleets_2_desc: "The seas are still of paramount importance to us, they are our origin, they feed us, and it is on their choppy waves that we can control trade and defense the isles. More ships for mercantile and military purposes would both suit us nicely."
 saxan_grander_fleets_3: "Grander Fleets"
 saxan_grander_fleets_3_desc: "The seas are still of paramount importance to us, they are our origin, they feed us, and it is on their choppy waves that we can control trade and defense the isles. More ships for mercantile and military purposes would both suit us nicely."
 saxan_priesthood: "Saxan Priesthood"
 saxan_priesthood_desc: "As our prosperity and prominence grows, so to should the priesthood behind us. Let us spread our traditions and rituals to our new subjects and let them see the error of their ways."
 saxan_priesthood_2: "Saxan Priesthood"
 saxan_priesthood_2_desc: "As our prosperity and prominence grows, so to should the priesthood behind us. Let us spread our traditions and rituals to our new subjects and let them see the error of their ways."
 saxan_priesthood_3: "Saxan Priesthood"
 saxan_priesthood_3_desc: "As our prosperity and prominence grows, so to should the priesthood behind us. Let us spread our traditions and rituals to our new subjects and let them see the error of their ways."
 saxan_widespread_family_ties: "Widespread Family Ties"
 saxan_widespread_family_ties_desc: "The Saxans are not particularly picky with their marital ties, especially with the lower and unlanded nobility. This behavior naturally disseminates our culture throughout our conquests as our people marry into new lines and integrate new traditions. We should fund more marriages with conquered nobility and encourage the same among our lessers."
 saxan_widespread_family_ties_2: "Widespread Family Ties"
 saxan_widespread_family_ties_2_desc: "The Saxans are not particularly picky with their marital ties, especially with the lower and unlanded nobility. This behavior naturally disseminates our culture throughout our conquests as our people marry into new lines and integrate new traditions. We should fund more marriages with conquered nobility and encourage the same among our lessers."
 saxan_widespread_family_ties_3: "Widespread Family Ties"
 saxan_widespread_family_ties_3_desc: "The Saxans are not particularly picky with their marital ties, especially with the lower and unlanded nobility. This behavior naturally disseminates our culture throughout our conquests as our people marry into new lines and integrate new traditions. We should fund more marriages with conquered nobility and encourage the same among our lessers."
 saxan_seaxe_marines: "Seaxe Marines"
 saxan_seaxe_marines_desc: "Our armies are often needed on many coasts, and the quickest way is often by boat. The faster we can get our soldiers onto land, the less likely we are to face disaster on the battlefield or be caught off guard. Our naval academies should continue to refine these strategies."
 saxan_seaxe_marines_2: "Seaxe Marines"
 saxan_seaxe_marines_2_desc: "Our armies are often needed on many coasts, and the quickest way is often by boat. The faster we can get our soldiers onto land, the less likely we are to face disaster on the battlefield or be caught off guard. Our naval academies should continue to refine these strategies."
 saxan_seaxe_marines_3: "Seaxe Marines"
 saxan_seaxe_marines_3_desc: "Our armies are often needed on many coasts, and the quickest way is often by boat. The faster we can get our soldiers onto land, the less likely we are to face disaster on the battlefield or be caught off guard. Our naval academies should continue to refine these strategies."
 iberian_ideas: "Iberian Ideas"
 iberian_ideas_start: "Iberian Traditions"
 iberian_ideas_bonus: "Iberian Ambitions"
 iberian_coming_of_lirit: "Coming of Lirit"
 iberian_coming_of_lirit_desc: "Saint Lirit preached the ways of God in Iberia during the 8th century, as though to protect us in the face of the coming storm from Arabia. It was through his dedication and his persecution that he became a unifying symbol to the Christians of Iberia, and when the Roman tyrants fought to dispel our newfound faith in God, we fought back and secured our safe worship."
 iberian_wars_of_independence: "Wars of Independence"
 iberian_wars_of_independence_desc: "The Romans were not the only ones we have fought against for our independence, however. The Umayyad Caliphate made some inroads into Iberia but was not truly successful until they moved their capital to Cordoba, subjugating most of the Christian kingdoms during their Iberian era. It would be only be in the face of the intolerance of the Almoravid movement that we would pick up our torches and pitchforks again and drive out the Islamic invaders from the northwest - but our struggles continue to this day."
 iberian_the_atlantic_exodus: "The Atlantic Exodus"
 iberian_the_atlantic_exodus_desc: "As word spreads of lands beyond the sea, many have found such the possibilities that lie abound to be far more attractive than the dreary state of affairs back at home. The prospect of securing the safety of Christ's message away from the conflicts of the Muslim and German kingdoms excites many of our people greatly."
 iberian_capable_hands_at_sea: "Capable Hands at Sea"
 iberian_capable_hands_at_sea_desc: "Our long nautical traditions have left us quite prepared to establish a large Atlantic navy. Let our enemies tremble when they see our battle flag unfurled!"
 iberian_defending_atlantic_migrants: "Defending Atlantic Migrants"
 iberian_defending_atlantic_migrants_desc: "The status quo of the seas has favored the old Viking merchants and itinerant Muslims for far too long. No more will Atlantic refugees have to fear the black flag, for our fleets will protect from harassment and enslavement."
 iberian_kingdom_of_god: "Kingdom of God"
 iberian_kingdom_of_god_desc: "We are truly creating a Kingdom of God on this Earth, with Iberia at its center and the colonies at its peripheries. The Atlantic fleets are the blood of this kingdom, and our global network has spread the word of Christ Almighty further than it ever has before."
 iberian_global_innovation: "Global Innovation"
 iberian_global_innovation_desc: "With so many new people and faces pouring into Iberia from newer Christian populations around the world, it is inevitable that innovations come naturally to us. Let us usher in a new age of infrastructure and bring glory to this Kingdom of God!"