l_english:
 fabricate_armenian_invasion_cb: "Justify Invasion"
 fabricate_armenian_invasion_cb_title: "Justify Invasion"
 fabricate_armenian_invasion_cb_desc: "Justify Invasion will reduce the size of our §Y[From.GetAdjective]§! Spy Network by §R[Root.GetSpyCostHardCoded]§! and will give us the '§YArmenian Campaign of Conquest§!' casus belli against §Y[From.GetName]§!, allowing us to subjugate §Y[From.GetName]§! and turning them into an §YAshkharh§! of our [Root.GovernmentName].\n\nThis casus belli will last for §Y5 years§!.\n\n§YAshkharhs can be turned into Core Ashkharhs which can be annexed for 6 £dip£ per development.§!"
 fabricate_armenian_invasion_cb_tooltip: "Justify an invasion against the target country and gain the 'Armenian Campaign of Conquest' casus belli against them."
 reign_in_ashkharh: "Rein in Ashkharh"
 reign_in_ashkharh_title: "Rein in Ashkharh"
 reign_in_ashkharh_desc: "Rein in §Y[From.GetName]§!'s and turn them into a §YCore Ashkharh§!. This will allow us to integrate §Y[From.GetName]§!, but we will not be able to call §Y[From.GetName]§! into any wars.\n\n§YCore Ashkharhs can be annexed for 6 £dip£ per development.§!"
 reign_in_ashkharh_tooltip: "Rein in the target from Ashkharh to Core Ashkharh status, allowing us to integrate the target, but disabling our ability to call them in our wars."
 reign_in_ashkharh_alert_tooltip: "An offer to turn us into a §YCore Ashkharh§!"
 reign_in_ashkharh_dialog: "[This.GetName] wants to turn us into their Core Ashkharh, exempting us from their wars, but allowing them to integrate us."
 call_ashkharh_into_wars: "Call Ashkharh to War"
 call_ashkharh_into_wars_title: "Call Ashkharh to War"
 call_ashkharh_into_wars_desc: "Spend up to §R20§! Favors with §Y[From.GetName]§! and call them into ALL of §Y[Root.GetAdjective]§! wars. The cost is reduced by §Y10§! Favors if we can call §Y[From.GetName]§! only into defensive wars."
 call_ashkharh_into_wars_tooltip: "Use our favors with the target country in order to call them into our wars."
