 CBHayastanEvents.0t: "Hayastan Offers Provincial Integration"
 CBHayastanEvents.0d: ""
 CBHayastanEvents.0a: "Yes!"
 CBHayastanEvents.0b: "No!"
 CBHayastanEvents.1t: "The Council of Atropatene"
 CBHayastanEvents.1d: "The leaders and clergy of [Root.GetName], [ERS.GetName], and [PNT.GetName] have convened in Atropatene to discuss matters of faith, as our three nations lie on the crossroads of worlds."
 CBHayastanEvents.1a: "The teachings of Mani are enough."
 CBHayastanEvents.1b: "Those Mandaeans have some interesting points..."
 CBHayastanEvents.1c: "What about a return to the ways of Zarathustra?"
 CBHayastanEvents.1e: "Perhaps a more pacifist approach?"
 CBHayastanEvents.1f: "The followers of the so-called 'living god' could be right"
 CBHayastanEvents.1g: "A return to the old ways is necessary."
 CBHayastanEvents.1h: "Where's that carpet salesman who's always talking about 'Vishnu?'"
 CBHayastanEvents.1i: "Maybe a return to our hellenized roots is best?"
 CBHayastanEvents.1j: "We need to think about this more."
