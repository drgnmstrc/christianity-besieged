  power_and_parliment: "Power and Parliment"

  ## Casus Bellis
  retrieve_the_hill_of_tara_cb: "Retrieve the Hill of Tara"
  retrieve_the_hill_of_tara_cb_desc: "The Hill of Tara has been seized by a false king! We must wrest it from their hands."

  ## Decisions
  proclaim_high_kingdom_of_ireland_title: "Proclaim High King of Ireland"

  ## Events
  irish_events.1.t: "Proclaimed high king of ireland!"
  irish_events.1.d: "You have proclaimed yourself high king of ireland!"
  irish_events.1.a: "They shall all kneel before us!"

  irish_events.2.t: "High king of ireland demands loyalty."
  irish_events.2.d: "Someone has declared themselves the high king of ireland"
  irish_events.2.a: "We shall kneel"
  irish_events.2.b: "We shall not kneel"

  irish_events.3.t: "False high king of ireland demands loyalty."
  irish_events.3.d: "Someone has falsely declared themselves the high king of ireland!"
  irish_events.3.a: "We shall kneel."
  irish_events.3.b: "We shall not kneel."

  irish_events.4.t: "Seized Hill of Tara!"
  irish_events.4.d: "You have seized the Hill of Tara! Lia Fáil roars in joy, for a true high king of ireland hold dominion!"
  irish_events.4.a: "Onwards! To glory!"

  irish_events.5.t: "Hill of Tara lost!"
  irish_events.5.d: "A pretender has seized the Hill of Tara! Lia Fáil roars once again, for a false king pretends dominion over ireland!"
  irish_events.5.a: "We roar with Lia Fáil!"

  irish_events.6.t: "A Warrior Reborn"
  irish_events.6.d: "After countless battles on warrior stands tall above all others, Eimear Dunn!"
  irish_events.6.a: "From this day on she shall be known as Eimear Chullain!"

