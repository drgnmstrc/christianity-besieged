  ## Governments
  insular_tribal_monarchy_name: "Tribal Monarchy"
  irish_tribal_monarch_mechanic: "Irish Monarchy"
  irish_tribal_monarch_mechanic_desc: "Irish kingdom were collections of clansmen with a king at their head and the druids to guide them."

  irish_kingdom: "Irish Kingdom"
  irish_kingdom_desc: "The Irish Kingdoms rule in tandem with the druids of Ireland, though their power is oft overshadowed by the religious elites."

  irish_parlimentary_kingdom: "Irish Parlimentary Kingdom"
  irish_parlimentary_kingdom_desc: "The Irish Parlimentary Kingdoms rule in tandem with the druids of Ireland, though their power is oft overshadowed by the members of their parliments."

  irish_high_kingdom: "Irish High Kingdom"
  irish_high_kingdom_desc: "The King coronated at the Lia Fáil is preeminent above all others on the Isle. Should a petty king wish to take this right, then it is the Hill of Tara they must claim."

  irish_high_parlimentary_kingdom: "Irish High Parlimentary Kingdom"
  irish_high_parlimentary_kingdom_desc: "The King coronated at the Lia Fáil is preeminent above all others on the Isle but to his parliment. Should a petty king wish to take this right, then it is the Hill of Tara they must claim."

