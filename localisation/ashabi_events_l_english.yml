l_english:
 ashabiDebateEvent_0_title: "Excellent debate during Ramadan"
 ashabiDebateEvent_0_desc: "During Ramadan, the nobility and family of the [Root.Monarch.GetTitle] gathered for prayer and discussion of the word of God, and [Root.Monarch.GetName] was very astute, showing excellent and unique reflections of early Islamic writing and driving forward the most interesting conversations of the discussion."
 ashabiDebateEvent_0a: "[Root.Monarch.GetName] is key to our modern understanding of God."
 ashabiDebateEvent_1_title: "Embarrassing debate during Ramadan"
 ashabiDebateEvent_1_desc: "During Ramadan, the nobility and family of the [Root.Monarch.GetTitle] gathered for prayer and discussion of the word of God, but [Root.Monarch.GetName] has made an embarrasment of [Root.Monarch.GetHerselfHimself]. Showing little understanding of fundamental Islamic theology and even quoting heavily disputed phrases of the Quran, the entire showing was an embarassment."
 ashabiDebateEvent_1a: "The [Root.Monarch.GetTitle] needs to study more theology."
 ashabiDebateEvent_1b: "[Root.Monarch.GetName] should leave religious affairs to the clergy."
 RUMCALIPHATE: "Caliphate of Rum"
 RUMCALIPHATE_ADJ: "Rumi"
 #
 #The Kursikan Diyt
 #
 raided_by_kursika: "[Root.kursikaDLC]"
 kursika_DLC: "Has been raided by pirates from Kursika."
 kursika_DLCless: "Has a claim on Kursika."
 ashabiDebateEvent.2t: "The Status of Kursika"
 ashabiDebateEvent.2d: "We have come to the point where action must be taken against the pirates who have made the power vaccum in Kursika their home. How should we approach the situation?"
 ashabiDebateEvent.2a: "We must directly take control of the situation and call a Diyt."
 ashabiDebateEvent.2b: "We should seek a covert solution with a powerful Captain in Kursika."
 ashabiDebateEvent.2c: "Protect their autonomy - Allah has a destiny for them."
 ashabiDebateEvent.3t: "The Kursikan Diyt"
 ashabiDebateEvent.3d: "The House of God has called the representative Muftis of Rum for a Diyt on the status of the power vaccuum of Kursika, which they claims must be pacified and placed under direct authority of the Caliphate. Should 10 Muftis and/or the Ifriqyan Grand Mufti contest this claim, it will cause problems for Bayt Allah's plans. How should our representatives respond to the developing situation?"
 ashabiDebateEvent.3a: "Support the Caliph's decision."
 ashabiDebateEvent.3b: "Prevent interference within Kursika's borders."
 ashabiDebateEvent.3c: "Contest the Bayt Allah's influence in Kursika."
 ashabiDebateEvent.4t: "Abdullah ibn Balfaqr al-Bahrjawt"
 ashabiDebateEvent.4d: "Abdullah ibn Balfaqr al-Bahrjawt, or Balfaqr the Sea-Goth, is a powerful and well respected Juthudi pirate Captain who is well posited to position his fleet within dynastic control of the island of Kursika. Given we give him the resources necessary to be able to guarantee the loyalty of his full fleet and escalate his power enough to exact full authority, we can have a powerful subject underneath our rule."
 ashabiDebateEvent.4a: "Give him the full support of the Bayt Allah."
 ashabiDebateEvent.4b: "The Caliph will provide him with full support."
 ashabiDebateEvent.4c: "Provide limited support."
 ashabiDebateEvent.5t: "Kursika Contested in Diyt"
 ashabiDebateEvent.5d: "The call to accept Caliph authority over the island of Kursika has been met with vocal opposition within the Diyt, preventing al-Bayt from being able to take control unopposed. It seems likely that the Diyt will end in frustration for all parties."
 ashabiDebateEvent.5a: "Concede and diffuse tensions."
 ashabiDebateEvent.5b: "Denounce these corrupt Muftis and leave the Diyt with tensions high."
 ashabiDebateEvent.5c: "So many corrupt Muftis in the court..."
 ashabiDebateEvent.5e: "The Caliph is our religious leader, not our overlord."
 ashabiDebateEvent.5f: "Praise Allah for pushing us to contest this corrupt Caliph."
 ashabiDebateEvent.6t: "Takeover of Kursika"
 ashabiDebateEvent.6d: "Without effective resistance within the Diyt against Caliph authority over Kursika, the machinations were swiftly put into place. Local leaders with ties to the religious bureaucracy have been selected to rule the island, and anti-piracy actions are being actively put into place."
 ashabiDebateEvent.6a: "We will benefit from calmer seas and new leadership."
 ashabiDebateEvent.6b: "Horror!"
 ashabiDebateEvent.6c: "This is a good day for the Muslim world."
 ashabiDebateEvent.6e: "Horror!"
 ashabiDebateEvent.7t: "The Kursika Coup"
 ashabiDebateEvent.7d: "Abdullah ibn Balfaqr al-Bahrjawt, a prominent, powerful, idolized Mutawasiti sea reaver, has massacred or subdued the majority of pirate captains in Kursika in an act of betrayal sponsored by the Bayt Allah. With the help of their fleets, many surviving pirate captains have been captured and many more are on the run. And with the Caliph personally accepting Abdullah's family's sayyid status, the road to Abdullah al-Bahrjawt's dynastic rule under Caliph supervision has been made crystal clear."
 ashabiDebateEvent.7a: "We will benefit from calmer seas and new leadership."
 ashabiDebateEvent.7b: "Horror!"
 ashabiDebateEvent.8t: "Death of Abdullah ibn Balfaqr al-Bahrjawt"
 ashabiDebateEvent.8d: "Abdullah ibn-Balfaqr al-Bahrjawt, a prominent sea reaver that was active in Kursika, made an attempt during a council of captains to betray his fellow captains for a power grab. However, the attempt was subdued, and Abdullah himself died in a duel with a fellow captain."
 ashabiDebateEvent.8a: "Horror!"
 ashabiDebateEvent.8b: "Three cheers for our band of brothers!"
 preparingKursikanDiytA: "This solution is honorable, inexpensive and guaranteed to work - if we get the diplomatic support of our fellow faithful. We might be contested by the Grand Mufti or a great enough choir of the smaller regional Muftis."
 preparingKursikanDiytB: "This solution will certainly carry a financial cost."
 preparingKursikanDiytC: "This solution lacks ulterior consequences but provides limited benefit."
 #
 #Illeropoli Diyt
 #
 cb_caliphial_intervention: "Caliphial Interventiuon"
 cb_caliphial_intervention_desc: "We must directly intervene in the situation and extend the direct influence of the Caliphate."
 caliphial_intervention: "Caliphial Intervention"
 ashabiDebateEvent.10t: "Preparing the Illeropoli Diyt"
 ashabiDebateEvent.10d: "With the autonomy of the religious faithful within the pious city of Illeropoli at risk, it is up to the Caliph to make the decision on how best to approach the Illeropoli question. What would the best solution for Illeropoli's future entail?"
 ashabiDebateEvent.10a: "We must protect Illeropoli and grant it autonomy directly under the Caliph."
 ashabiDebateEvent.10b: "We must free Illeropoli and grant them complete independence."
 ashabiDebateEvent.10c: "We must free Illeropoli and grant it the security of the Caliph."
 ashabiDebateEvent.10e: "We must incorporate Illeropoli directly into the Caliphate."
 ashabiDebateEvent.10f: "We need to secure jurisdiction over the security of the faithful in Illeropoli."
 ashabiDebateEvent.10g: "We must enforce the true faith in the Illeropoli court."
 preparingIlleropoliDiytA: "While gaining overlord status over Illeropoli directly is a fool-proof method of securing the city's safety, it will be harder to pass in debate."
 preparingIlleropoliDiytB: "Freeing the city of Illeropoli is a righteous call, and should be easier to garner support for in debate."
 preparingIlleropoliDiytC: "While taking direct control over Illeropoli is a fool-proof method for securing the city's safetly in the long-term, it will be harder to pass in debate."
 preparingIlleropoliDiytD: "While establishing suzerainty over Illeropoli will secure the safety of the faith in the city in the long-term, it will be harder to pass in debate."
 preparingIlleropoliDiytE: "Simply enforcing the Alsababi faith within the framework of the Illeropoli government should be easier to garner support for in debate."
 ashabiDebateEvent.11t: "The Illeropoli Diyt"
 ashabiDebateEvent.11d: "The faithful have come together to discuss the port city of Illeropoli, which currently exists as a subject to [event_target:illeropoliOwner.GetName]. The Caliph claims that they are a threat to Illeropoli's security, not only as an historical Roman and Islamic city but as a major trade hub and center of learning. Consequently, Illeropoli, they claim, would be better off underneath their watchful eye. Should we attempt to contest their efforts?"
 ashabiDebateEvent.11a: "Support the Caliph's decision."
 ashabiDebateEvent.11b: "Contest the Caliph's decision."
 ashabiDebateEvent.12d: "The faithful have come together to discuss the port city of Illeropoli, which currently exists as a subject to [event_target:illeropoliOwner.GetName]. The Caliph claims that they are a threat to Illeropoli's security, not only as an historical Roman and Islamic city but as a major trade hub and center of learning. Consequently, they claim Illeropoli should be freed. How should we respond?"
 ashabiDebateEvent.13d: "The faithful have come together to discuss the port city of Illeropoli, which is directly controlled by the [event_target:illeropoliOwner.GovernmentName] of [event_target:illeropoliOwner.GetName]. The Caliph claims that this situation stifles Illeropoli's historical importance as a major trade hub and a center of learning from medieval Rome into the contemporary era. Consequently, they claim Illeropoli should be freed and placed underneath the protection of al-Bayt. Should we attempt to contest their efforts?"
 ashabiDebateEvent.14d: "The faithful have come together to discuss the port city of Illeropoli, which is directly controlled by the [event_target:illeropoliOwner.GovernmentName] of [event_target:illeropoliOwner.GetName]. The Caliph claims that this situation stifles Illeropoli's historical importance as a major trade hub and a center of learning from medieval Rome into the contemporary era. Consequently, they claim Illeropoli should be transferred directly into the Caliph's administration. Should we attempt to contest their efforts?"
 ashabiDebateEvent.15d: "The faithful have come together to discuss the port city of Illeropoli, which has strayed away from Alsababi Islam and become [LRP.Religion.GetName]. The Caliph claims that this situation stifles Illeropoli's historical importance as an Islamic city since Illeropoli seceded from the Roman Empire underneath Ifriqya's protection centuries ago. Consequently, they claim Illeropoli should be transferred to the Caliph's administration, where proper Ashab Alsabab Sharia law can be re-implemented. Should we attempt to contest their efforts?"
 ashabiDebateEvent.16d: "The faithful have come together to discuss the port city of Illeropoli, which has strayed away from Alsababi Islam and become [LRP.Religion.GetName]. The Caliph claims that this situation stifles Illeropoli's historical importance as an Islamic city since Illeropoli seceded from the Roman Empire underneath Ifriqya's protection centuries ago. Consequently, they claim Illeropoli's government should be forced to reimplement proper Ashab Alsabab Sharis law. Should we attempt to contest this effort?"
 ashabiDebateEvent.18t: "Diyt Faces Heavy Resistance"
 ashabiDebateEvent.18d: "Despite the Caliph's best efforts and intentions, they faced heavy resistance within the Diyt. This has left it nearly impossible for the Caliph to gain legal support for their claims through the religious consensus of the Diyt, with frusteration rising in all parties involved as the debate threatens to devolve into viscious arguments."
 ashabiDebateEvent.18a: "Placate the opposition and drop the claims."
 ashabiDebateEvent.18b: "Leave in a huff amidst the chaotic argument in the court."
 ashabiDebateEvent.18c: "The Caliph loves trying to overstep his boundaries."
 ashabiDebateEvent.19t: "Diyt Reaches Agreement"
 ashabiDebateEvent.19d: "The faithful are in agreement: something must be done about the situation in Illeropoli. The consensus has strengthened around the Caliph's proclamation, clearing their path to follow through with it."
 ashabiDebateEvent.19a: "Our claim is now enforced by religious law."
 ashabiDebateEvent.19b: "Send Illeropoli an ultimatium."
 ashabiDebateEvent.19c: "Send [event_target:illeropoliOwner.GetName] an ultimatium."
 ashabiDebateEvent.19e: "What a glorious day!"
 ashabiDebateEvent.19f: "And so the sheep follow."
 ashabiDebateEvent.20t: "The Illeropoli Ultimatium"
 ashabiDebateEvent.20da: "Religious representatives of the Alsababi Caliph and a slew of other Alsababi nations have come to [Root.Capital.GetCapitalName] to press forward some serious demands with major backup. Claiming our rule to have brought 'decadence' to the port-city of Illeropoli, we are to immediately transfer our suzerainty over it to the Bayt Allah. The lunatics have gone so far as making our rule into a codified breach of Alsababi Islamic law, and we will face near-universal backlash from the Alsababi community for rejecting their terms - save for those who vouched for us in their courts."
 ashabiDebateEvent.20db: "Religious representatives of the Alsababi Caliph and a slew of other Alsababi nations have come to [Root.Capital.GetCapitalName] to press forward some serious demands with major backup. Claiming our rule to have brought 'decadence' to the port-city of Illeropoli, we are to immediately release it from its status underneath us. The lunatics have gone so far as making our rule into a codified breach of Alsababi Islamic law, and we will face near-universal backlash from the Alsababi community for rejecting their terms - save for those who vouched for us in their courts."
 ashabiDebateEvent.20dc: "Religious representatives of the Alsababi Caliph and a slew of other Alsababi nations have come to [Root.Capital.GetCapitalName] to press forward some serious demands with major backup. Claiming our rule to have brought 'decadence' to the port-city of Illeropoli, we are to immediately release it into the vassalage of the Bayt Allah. The lunatics have gone so far as making our rule into a codified breach of Alsababi Islamic law, and we will face near-universal backlash from the Alsababi community for rejecting their terms - save for those who vouched for us in their courts."
 ashabiDebateEvent.20dd: "Religious representatives of the Alsababi Caliph and a slew of other Alsababi nations have come to [Root.Capital.GetCapitalName] to press forward some serious demands with major backup. Claiming our rule to have brought 'decadence' to Illeropoli, we are to immediately cede the port-city to the Bayt Allah. The lunatics have gone so far as making our rule into a codified breach of Alsababi Islamic law, and we will face near-universal backlash from the Alsababi community for rejecting their terms - save for those who vouched for us in their courts."
 ashabiDebateEvent.20de: "Religious representatives of the Alsababi and a slew of other Alsababi nations have come to [Root.Capital.GetCapitalName] to press forward some serious demands with major backup. Claiming our rule to have brought 'decadence' to Illeropoli, we are to immediately convert and accept the suzerainty of the Bayt Allah. The lunatics have gone so far as making our rule into a codified breach of Alsababi Islamic law, and we will face near-universal backlash from the Alsababi community for rejecting their terms - save for those who vouched for us in their courts."
 ashabiDebateEvent.20df: "Religious representatives of the Alsababi and a slew of other Alsababi nations have come to [Root.Capital.GetCapitalName] to press forward some serious demands with major backup. Claiming our rule to have brought 'decadence' to Illeropoli, we are to immediately convert. The lunatics have gone so far as requiring Alsababi Sharia law to be practiced in Illeropoli to not be in breach of Islamic law, and we will face near-universal backlash from the Alsababi community for rejecting their terms - save for those who vouched for us in their courts."
 ashabiDebateEvent.20a: "Reject these outlandish terms!"
 ashabiDebateEvent.20a_tt: "You will become very quickly hated by everyone in the Alsababi community who supported this measure, especially the Caliph."
 ashabiDebateEvent.20b: "Transfer Illeropoli to the Bayt Allah."
 ashabiDebateEvent.20b_tt: "The Alsababi community will be very happy with our acceptance, especially the Caliph.
 ashabiDebateEvent.20c: "Release Illeropoli from vassalage."
 ashabiDebateEvent.20d: "Release Illeropoli to the Bayt Allah."
 ashabiDebateEvent.20e: "Cede Illeropoli to the Bayt Allah."
 ashabiDebateEvent.20f: "Submit to the Bayt Allah as a vassal."
 ashabiDebateEvent.20g: "Convert to Alsababi Islam."
 ashabiDebateEvent.21t: "Ultimatium Rejected!"
 ashabiDebateEvent.21d: "[event_target:illeropoliOwner.GetName] has ungraciously rejected our Ultimatium, much to the shock and horror of the Alsababi community. This is truly a dark day."
 ashabiDebateEvent.21a: "They will pay."
 ashabiDebateEvent.21b: "A dark moment in history."
 ashabiDebateEvent.22t: "Ultimatium Rejected!"
 ashabiDebateEvent.22d: "[event_target:illeropoliOwner.GetName] has graciously accepted our Ultimatium, understanding the truth behind our actions giving us our concessions. This will go down in Islamic history as one of the defining moments of the sect and a showcase of the power of our religious consensus."
 ashabiDebateEvent.22a: "Praise Allah for granting us this civilized victory!"
 ashabiDebateEvent.22b: "Mashallah! This is proof!"
 ashabiDebateEvent.22c: "How spineless of them to crack so easily."
 isildaDiyt.t: "Isilda Nojua"
 isildaDiyt.d: "In the excitement of innovative thought rampant across Ferrara, one person on the frontier particularly stands out from the crowd: Isilda Nojua. She has written a great deal of essays, the most influential to her legacy being her writings towards equity for men and women alike.\n Citing the influence of women such as Khadijah and Fatimah, the many Quranic references to the spiritual equality that must be achieved between sexes, and that all are free to pursuit of education - Isilda is advocating for a loosening of restrictions of women in positions of power within the state, so as to use their knowledge to better the [Root.GovernmentName]."
 isildaDiyt.a: "Respect her right to speak at local debates."
 isildaDiyt.b: "Expel this heathenous speaker!"
 ferrara_imams_displeased: "Imams Displeased"
 ferrara_imams_pleased: "Imams Pleased"
 isildaDiyt.1t: "The Eminence of Isilda"
 isildaDiyt.1d: "At local debates, Isilda has been tearing apart opposition to her reforms, building up a support base at fever pitch. We have little justification now to not at least attempt an implementation of some of these ideas."
 isildaDiyt.1a: "Perhaps these concepts hold some merit."
 isildaDiyt.1b: "Okay, time to put an end to this."
 isildaDiyt.2da: "Hailing from Ferrara, an interesting woman has arrived in the House of God. Seeking a fair trial to her reforms, she quickly weaves the tale of how she seemingly threatened her rulers' fragile self esteem by showing, as a woman, her prowess in debate, proving the worth of herself and her values. Having been unlawfully denied the opportunity to test the validity of her reforms in Ferrara, she beseeches the Caliph for the opportunity to speak out to the learned theologians of the highest court of God."
 isildaDiyt.2db: "Hailing from Ferrara, an interesting woman has arrived in the House of God. Seeking a fair trial to her reforms, she quickly weaves the tale of how she was unlawfully expelled from her home the moment she began to talk of change. Claiming this reactionary actions to be antithetical to the very nature of the faith, she beseeches the Caliph for the opportunity to speak out to the learned theologians of the highest court of God."
 isildaDiyt.2a: "Allow her to present her ideas in a Diyt."
 isildaDiyt.2b: "Her ideas have no place in the Ashab Alsabab."
 isisldaDiyt.3t: "Ferrara's Reforms"
 isildaDiyt.3d: "Word has spread to the Bayt Allah of the interesting reforms that have taken place in the city state of Ferrara. Spearheaded by the efforts of one of the most influential modern thinkers of northern Italya, Isilda Nojua, women have begun to take places in important government roles, and even rumors spread that their presence has even spread into the military. According to delegations from the city, the entire process was legal and her reforms hold great merit for the potential future of all holy women."
 isildaDiyt.3a: "They can keep their strange new customs to themselves."
 isildaDiyt.3b: "Hold a Diyt regarding the legality of the reforms."
 isilda_diyt_tt: "We will call the religious representatives of all notable nations of the faith, to discuss whether these reforms are truly God's will."
 isildaDiyt.4t: "The Diyt of Isilda Nojua"
 isildaDiyt.4d: "The Caliph has called the faithful to a Diyt regarding the reforms proposed by Isilda Nojua, which would bring sweeping gender equity. Isilda believes that the status quo is antithetical to the word of God, who told Muhammad of the importance of spiritual equality and the opportunity for all individuals to seek education, and to use their education in betterment of the faith. The possible strength to gain for the entire Caliphate, she says, it too much to bear. The opposition, however, additionally has many Quranic sources that clearly indicate the specific complimentary roles of women in society, and a single husband to many wives is a clear indicator of this. But Isilda retorts, believing the decision comes from weighing the potential biases of Muhammad, the prophet, against those of the Arabic society in which he was born into, many of whom repeatedly attempted to curb his efforts to spread the faith. The debate is heated, though her staunchest opponents seemingly struggle staying level-headed, the paradox of their respect for gender roles preventing them from trying to intimidate her in front of the Caliph."
 isildaDiyt.4a: "She has crafted a strong case for herself."
 isildaDiyt.4b: "I've never seen a woman so thoroughly twist the Quran!"
 isildaDiyt.4c: "Her reforms have been a resounding success!"
 isildaDiyt.4d: "Can we put this nonsense to rest?"
 isildaDiyt.4e: "Oversee the progressions."
 isildaDiyt.6t: "Isilda is Victorious"
 isildaDiyt.6d: "The votes are in, and it is settled - the faith's greatest thinkers are behind Isilda. Clearly, the political circumstances of Muhammad's rise to power forced him to make concessions towards the truth in order to convince his fellow neighbors to begin to take the holy path forward. And through diplomacy, faith, conquest, and the pursuit of knowledge, we have purified God's holy designs from their worldly coils. Women have been wrongly closed from greater pursuits, and to continue to close them would be to knowingly defer from His designs."
 isildaDiyt.6a: "What an interesting development."
 isildaDiyt.6b: "We never doubted she would triumph."
 isildaDiyt.6c: "Glory to Allah!" 
 isildaDiyt.6e: "How did this happen..?"
 isildaDiyt.7t: "Isilda is Defeated"
 isildaDiyt.7d: "The votes are in, and it is settled - these reforms have no place in the Ashab Alsabab. It is without question that influential women such as Khadijah and Fatimah have made the faith what it is today - but their role was, and always will be, a complimentary role to the one that men have today. This status quo has brought great success to the faith, and nearly every other sect and school of jurisprudence agrees with it. Isilda's reforms have no place in a Godly society."
 isildaDiyt.7a: "A fairly predictable outcome."
 isildaDiyt.7b: "Finally, she's gone!"
 isildaDiyt.8d: "A fascinating woman has arrived in Venetia, a living pariah of the Alsababi world. Having aggressively pushed for reforms for equality based on some sort of loophole in their convoluted foreign scriptures, she seems ready to spend the rest of her days just beyond the reach of home, reflecting on her failures."
 isildaDiyt.8a: "What a sad woman."
 isildaDiyt.8b: "Let's give this working woman a new purpose."
 #
 #ashabiEvents
 #
 ashabiEvents.t: "Rise of the Džaferids"
 ashabiEvents.d: "Religious tensions have reached a boiling point with the burgeoning Ashabi minority. It seems one of the local Ashabi nobles has gained the support of some of the Caliphate's emirs, namely the support of the Istroli, in creating a popular revolt across the voivodes. They've already risen against our power base in the lowlands and gained substantial ground. To not stand against this uprising would reflect poorly upon our rule, but it may stretch our resources too thin."
 ashabiEvents.a: "We can't afford a conflict like this right now."
 ashabiEvents.b: "The Voivodes must be protected!"
 ashabiEvents.c: "Maybe they're onto something..."
 ashabiEvents.e: "Down with the Car!"
 ashabiEvents.f: "The Car shows weakness."