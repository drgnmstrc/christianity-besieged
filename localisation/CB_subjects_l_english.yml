l_english:
 make_norse_tribute_title: "Declare Holy Tribute"
 make_norse_tribute_tooltip: "Declare your vassal a tribute to the Gods, relegating a Jomsorden to assume control for conversion efforts."
 make_norse_tribute_desc: "Declare your vassal a tribute to the Gods, relegating a Jomsorden to assume control for conversion efforts. Keep in mind that you cannot annex a Tribute until it has converted all its provinces."
 norse_tribute_title: "Tribute"
 norse_tribute_desc: "Tributes are holy orders that are ruled by a Jomsorden, a holy order built in the image of the Jomsvikings of old."
 norse_tribute_title_plural: "Tributes"
 norse_tribute_is_our: "$NAME|Y$ is our Tribute."
 norse_tribute_annex_title: "Converted Tribute"
 norse_tribute_annex_desc: "A successful tribute, which has converted its local population to the true faith."
 norse_tribute_annex_title_plural: "Converted Tributes"
 norse_tribute_annex_is_our: "$NAME|Y$ is our Converted Tribute."

 taht_albayt_title: "Taht al-Bayt"
 taht_albayt_desc: "Taht al-Bayt, meaning Under the House, is a special status given to autonomous Bogeliks most closely aligned to the Caliph."
 taht_albayt_title_plural: "Taht al-Bayt"
 taht_albayt_is_our: "$NAME|Y$ has the protection of al-Bayt."

 locus_conventus_title: "Locus Conventus"
 locus_conventus_desc: "A locus conventus is a semi self governing body under full allegience to the Roman state."
 locus_conventus_title_plural: "Locus Conventibus"
 locus_conventus_is_our: "$NAME|Y$ is a local assembly under allegience to Rome."

 voivode_title: "Voivode"
 voivode_desc: "A voivode is a self-governing polity under the suzerainty of Grand Morava."
 voivode_title_plural: "Voivodes"
 voivode_is_our: "$NAME|Y$ is a voivode of the Car."

 shogun_vassal_title: "Shogun"
 shogun_vassal_desc: "The Shogunate is the northernmost appendage of the Japanese People, with supreme authority over the northern border."
 shogun_vassal_long_desc: "The Shogunate is the northernmost appendage of the Japanese People, with supreme authority over the northern border."
 shogun_vassal_title_plural: "Shoguns"
 shogun_vassal_is_our: "$NAME|Y$ is the appointed Sei-i Taishogun."

 syriac_brotherhood: "Akhuta"
 syriac_brotherhood_long_desc: "An Akhuta (from the Syriac word for 'brotherhood') represents the secular authority given to the Archbishops of the Syriac Church."
 syriac_brotherhood_is_our: "$NAME|Y$ is an Akhuta in the Syriac Church"
 syriac_brotherhood_title: "Akhuta"
 syriac_brotherhood_title_plural: "Akhutas"
 is_syriac_brotherhood: "Is Akhuta"

 ashkharh: "Ashkharh"
 ashkharh_long_desc: "An Ashkharh (from the Armenian word for 'world') is one of the formerly numerous provinces of the ancient Armenian Kingdom."
 ashkharh_is_our: "$NAME|Y$ is an Ashkharh under Hayastan"
 ashkharh_title: "Ashkharh"
 ashkharh_title_plural: "Ashkharhner"
 is_ashkharh: "Is Ashkharh"


 core_ashkharh: "Core Ashkharh"
 core_ashkharh_long_desc: "A Core Ashkharh behaves like any other Ashkharh, but is much closer tied to its overlord and is barely any different from directly controlled territory. Unlike normal Ashkharhs, a core Ashkharh cannot be called into any wars and can be annexed.."
 core_ashkharh_is_our: "$NAME|Y$ is a Core Ashkharh under Hayastan"
 core_ashkharh_title: "Core Ashkharh"
 core_ashkharh_title_plural: "Core Ashkharh"
 is_core_ashkharh: "Is Core Ashkharh"

