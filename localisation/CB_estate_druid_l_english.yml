  druid_made_sacrifices: "Appeased the Gods"
  desc_druid_made_sacrifices: "The gods have been appeased, and their wrath averted."

  druid_holy_site_modifier: "Holy Site"
  desc_druid_holy_site_modifier: "A site of worship consecrated by the druids."

  druid_conqured_holy_site_modifier: "Conqured Holy Site"
  desc_druid_conqured_holy_site_modifier: "A holy site of our enemies. It will bring us nothing but curses."

  druid_rebellion: "Druidic Rebellion"
  desc_druid_rebellion: "The druids have turned our people against us."

