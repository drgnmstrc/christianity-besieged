  ## Privileges
  druid_control_of_force_privilege: "Control of Force"
  druid_control_of_force_privilege_desc: "The druids commanded great respect in celtic society, at their request even the most fervorous of armies would lay down their arms and abandon battle. For many centuries the druids have mediated the kings in their declaration of conquest."

  druid_organisation_of_worship_privilege: "Organisation of Worship"
  druid_organisation_of_worship_privilege_desc: "Religious festivals have long been organised by the druids."

  druid_attendance_to_sacrifice_privilege: "Attendance to Sacrifice"
  druid_attendance_to_sacrifice_privilege_desc: "The gods must be appeased, and so we much sacrifice."

  druid_burden_of_scripture_privilege: "Burden of Scripture"
  druid_burden_of_scripture_privilege_desc: "For their insurection the druids have been burdened with their scripture. Forced to write oral traditions in the hope of removing their neccesity in the preservation of our culture."

  ## Actions
  druid_sacrifice_decision_title: "Make Sacrifices"
  druid_sacrifice_decision_desc: "The gods remain unsatiated, and we risk their wrath. Let us sacrifice what we have so that they might be appeased."

  druid_sponser_holy_site_decision_title: "Sponsor Holy Site"
  druid_sponser_holy_site_decision_desc: "Let us build a holy site for our druids, such that they may keep natures majesty."
  enable_estate_action_DRUID_SPONSER_HOLY_SITE_tt: "Sponsor Holy Site"

  druid_destroy_conqured_holy_site_decision_title: "Destroy Conqured Holy Site"
  druid_destroy_conqured_holy_site_decision_desc: "A holy site of our enemies resides within our lands! It must be stamped out!"

  druid_convert_conqured_holy_site_decision_title: "Convert Conqured Holy Site"
  druid_convert_conqured_holy_site_decision_desc: "A holy site of our enemies resides within our lands. But we do not fear our foes weak curses, we will do good to put it to our use"

