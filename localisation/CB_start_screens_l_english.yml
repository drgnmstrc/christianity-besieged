 string_start_nabatea: "In 1443, Amman, the Malik of Nabuthia went on a massive campaign of plundering across the sham, destroying any fort he came across with the help of some innovative weapons from the East. This resulted in the almost complete destruction of most forts in the region and the death of the Palmyrene Queen. In 1444, Palmyra, Judah, and the Assyrian states have been bullied by the ascendant Nabathu into paying protection money, and all are eager for revenge for the devastation Malik Amman caused."