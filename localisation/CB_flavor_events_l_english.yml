l_english:
 CBFlavorEvents.1t: "Twilight of Rome"
 CBFlavorEvents.1d: "In 1334, 110 years ago, the Turks crossed the Adriatic and have occupied Rome ever since, playing the sweet serenade of Islam to subdue their new subjects. The Twilight of Rome casts an enormous shadow over the future of all of Europa, and it is our duty to remind the Romans of their true suzerains."
 CBFlavorEvents.1a: "[Root.Capital.GetCapitalName] is the 2nd Rome."
 CBFlavorEvents.2t: "Apathy of Dhorhammer"
 CBFlavorEvents.2d: "The Nordic band of veterans concentrated at the fortress of Dhorhammer generally only cared about two things - the production of grapes and grain for alcohol, and the payment of tribute. This created an environment for the dominant Jewish population to be able to specialize in other trades with near total autonomy, evading the eyes of the Dhorhammer nobility and the larger Magyar entity they gave tribute to."
 CBFlavorEvents.2a: "So long as we're paid."
 CBFlavorEvents.3t: "The Nepopteia of [Root.Monarch.GetName]"
 CBFlavorEvents.3d: "Very early in [Root.Monarch.GetName]'s life, [Root.Monarch.GetSheHe] went through Telete and Epopteia, two layers of initiation into the Orphic rites in order to achieve salvation from the Titanic, purify and relive the suffering and death of Zagreus. But to rule over a land bound by the sacred oath of Dionysus, a ruler must go through the third layer, and participate in a Nepopteia. Only the grandest of sacrifices and the sharpest of agonies, to truly mark a new era. What kind of message does [Root.Monarch.GetName] have for [Root.Monarch.GetHerHis] people at the ceremony?"
 CBFlavorEvents.3a: "The Old [Root.Monarch.GetTitle] spins on the Wheel of Rebirth."
 CBFlavorEvents.3b: "We will hone our Titanic prisons to destroy our enemies."
 CBFlavorEvents.3c: "We must do what we can to purify ourselves."
 CBFlavorEvents.3e: "We shall seek intoxication of enthusiasm!"
 CBFlavorEvents.3f: "I am a messenger of the Bacchic One, sent to serve."
 CBFlavorEvents.4t: "The Caliph brings [Root.event_target:caliphial_culture.Culture.GetName] migrants to [Root.event_target:caliphial_province.GetName]"
 CBFlavorEvents.4d: "As per our agreement to assist with spreading the faithful across the lands, the Bayt Allah has attracted a community of [Root.event_target:caliphial_culture.Culture.GetName] to the frontier of our lands. However, we don't necessary need them to settle there. What should we do?"
 CBFlavorEvents.4a: "Accept them with gratitude."
 CBFlavorEvents.4b: "Distribute the [Root.event_target:caliphial_culture.Culture.GetName] amongt the colonies."
 CBFlavorEvents.4c: "We don't need [Root.event_target:caliphial_culture.Culture.GetName] in [Root.event_target:caliphial_province.GetName]!"
 CBFlavorEvents.7t: "A Preacher in [Root.GetName]"
 CBFlavorEvents.7da: "A local Hellenic preacher has been gaining quite some prominence within the community of [Root.GetCapitalName], teaching others about some of the fringe deities of the greater Hellenic pantheon. If left unopposed, the community seems certain to eventually change their religious views."
 CBFlavorEvents.7db: "A local Orphic preacher has been gaining quite some prominence within the community of [Root.GetCapitalName], something we discovered when city officials informed us of their discovery of large-scale initiation rites. His great sum of wealth and charismatic nature have allowed him to front the payments for and provide the community for these operations. If left unopposed, the community seems certain to eventually change their religious views."
 CBFlavorEvents.7dd: "A local Cybele preacher has been gaining quite some prominence within the community of [Root.GetCapitalName], making grand claims about Cybele being the original creation of the Titans, and the true protector of Anatolia. If left unopposed, the community seems certain to eventually change their religious views."
 CBFlavorEvents.7dc: "A local Neopythagorean preacher has been gaining quite some prominence within the community of [Root.GetCapitalName], stumping theologians and intellectuals left and right with a wealth of knowledge about the old philosophers. If left unopposed, the community seems certain to eventually change their religious views."
 CBFlavorEvents.7de: "A local Orthodox preacher has been gaining quite some prominence within the community of [Root.GetCapitalName], energizing the local population into a frenzy about the dangers of leaving behind the true pantheon of all Hellenic peoples, chastizing those who don't heed the cautionary tales of those who disgraced Zeus in the past. If left unopposed, the community seems certain to eventually change their religious views."
 CBFlavorEvents.7a: "Accept the preacher's influence."
 CBFlavorEvents.7b: "End the preacher's teachings."
 CBFlavorEvents.7b_tt: "Confront the preacher directly and seize his estates, if all goes well he should go quietly."
 CBFlavorEvents.8t: "Preacher Rediscovered!"
 CBFlavorEvents.8d: "The preacher somehow had managed to elude our first attempted capture, escaping to [Root.GetCapitalName] and establishing a new network of converts and connections before we could discover his whereabouts. How should we approach this situation?"
 CBFlavorEvents.8a: "Now he'll face retribution."
 CBFlavorEvents.8b: "Fine, he is permitted to preach again."
 CBFlavorEvents.8c: "Fine, bribe him to change his tune."
 CBFlavorEvents.9t: "Triumph of Cybele"
 CBFlavorEvents.9d: "At the temple in [Root.Capital.GetCapitalName], we bear tribute to the Mountain Mother of Anatolia, giving praise to her for our recent conquests. We have, in recent times grown to a respectable level, and to not give our proper respect would be to forgo the reward of our pious conquest."
 CBFlavorEvents.9a: "A humble gift from our humble [Root.GovernmentName]."
 CBFlavorEvents.9b: "A fine gift from our fine [Root.GovernmentName]."
 CBFlavorEvents.9c: "A great gift from our strong [Root.GovernmentName]."
 CBFlavorEvents.9e: "A lavish gift from our wealthy [Root.GovernmentName]."
 CBFlavorEvents.9f: "Only the best from our [Root.GovernmentName]."
 CBFlavorEvents.9g: "We come bearing gifts from every corner of our [Root.GovernmentName]."
 CBFlavorEvents.9h: "Grand tribute from across the continents."
 CBFlavorEvents.9i: "Tribute from across the world!"
 CBFlavorEvents.9j: "Fabulous tributes from our domineering [Root.GovernmentName]."
 CBFlavorEvents.9k: "The whole world gives you thanks, oh glorious Cybele."
 CBFlavorEvents.12t: "Union of States, or Divided and Conquered?"
 CBFlavorEvents.12d: "The proud representative city-states of the Znovuzaty represent a shining bastion of the legacy of the Roman Empire. Our people can profess their heritage from the Roman Dacia era, having settled the region in droves and intermingling with the local population, assimilating them into the prestiguous empire. Unfortunately, it wasn't fated to last, and whatever barbaric force could control the Carpathian Basin would have massive sway over our affairs. For centuries, this has been Great Morava, a state influenced and graced by but not borne from Rome. Though underneath the Moravans we have seen relative stability, we have remained disjointed from Italia for centuries. Are we truly united in this union of city-states? Or are the Moravans keeping us at bay, fearful of the power of an insurgent, independent Roman state?"
 CBFlavorEvents.12a: "We are regardless stuck in this status quo."
 CBFlavorEvents.13d: "In 1334, 110 years ago, the Turks crossed the Adriatic and have occupied Rome ever since, playing the sweet serenade of Islam to subdue their new subjects. The Twilight of Rome casts an enormous shadow over the future of all of Europa, and it is our duty to remind the Romans of their true suzerains. Let us find a model Roman from the glory days of old to aid us in our plight."
 CBFlavorEvents.13a: "Gnaeus Pompeius Magnus was one of the greatest generals and statesman of all time."
 CBFlavorEvents.13b: "Marcus Tullius Cicero did everything in his power to uphold the optimate principles."
 CBFlavorEvents.13c: "Marcus Licinuius Crassus had vision for Rome, and wit to amass the wealth to execute it."
 CBFlavorEvents.14t: "Ashes of the Middle Kingdom"
 CBFlavorEvents.14d: "The Middle Kingdom has experienced centuries of devastation and destruction. No figure has proven worthy enough to wrest the ancient, decayed Yuan horde from their bastion in Dadu, free to raid the weak but making no attempt to govern the realm. Foreign kings land on our shores with little resistance and the splintering of the faith across the Middle Kingdom threatens to split us apart further, perhaps irrevocably."
 CBFlavorEvents.14a: "We must put an end to this era of shame!"
 CBFlavorEvents.15t: "The Frisian Invasion"
 CBFlavorEvents.15d: "It seems that a large company of Frisians, lead by a petty band of disgruntled nobles from the mainland, have taken advantage of the instability of our court and have launched an invasion of the mainland. What should we do?"
 CBFlavorEvents.15a: "Defend our home!"
 CBFlavorEvents.15b: "Let us focus on protecting the refugees."
 CBFlavorEvents.15c: "We must end this bloodshed and make peace."
 CBFlavorEvents.16t: "Writing Conventions in Galagne"
 CBFlavorEvents.16d: "The early rulers of Galagne, or little Gaul, wore their German-ordained Donreritter familial name proudly, though with a breakdown of writing standardization subsequent rulers wrote their familial titles phonetically. Over time, this heavily warped their name to make it seem almost unrelated to anything Germanic at all, but had a deep influence on the speech patterns of Gallic speakers under their control."
 CBFlavorEvents.16a: "My son just trills the family name..."
 CBFlavorEvents.16b: "Why won't he just write the damned e?"
 CBFlavorEvents.16c: "It's a D, not a T!"
 CBFlavorEvents.16e: "Why does my eccentric heir trill our ENTIRE name??"
 CBFlavorEvents.16f: "Why does my heir have such a problem with our eloquent title?"
 CBFlavorEvents.16g: "I simplified our name for stability. Why make it bland..?"
 tuthegacian_royal_dialect: "Galagne Royal Dialect"
 desc_tuthegacian_royal_dialect: "The bizzare linguistic fads of the higher nobility have caused this generation of nobles to become increasingly detached from the commonfolk they preside over."
 cre_16a_tt: "You have grown to write the family name as Donerrite."
 cre_16b_tt: "You have grown to write the family name as Donerrit."
 cre_16c_tt: "You have grown to write the family name as Tonerris."
 cre_16e_tt: "You have grown to write the family name as Toœerris. The nobility love your flair!"
 cre_16f_tt: "You have grown to write the family name as Tœris, ending the golden age of the Royal Dialect."
 cre_16g_tt: "You have grown to write the family name as Turis."
 CBFlavorEvents.19t: "The Adventures of Ibn Kawash"
 CBFlavorEvents.19d: "Recently, a Berber by the name of Zakariya has gained a large audience among the dhimmi of [Root.GetName]. Known for his almost fantastical tales of travels from the Sahel to China (and most recently, his claims of strange islands past Jabal-Tariq), Zakariya initially began his journey as a Hajj from his hometown of [334.GetName]. After becoming inspired by the beauty of the Kaaba, he traveled to the city of [4289.GetName], where he converted to the ways of Zarathustra after a lengthy stay in the city. Needless to say, he comes with an extensive background in theology, linguistics, and cartography."
 CBFlavorEvents.19a: "Unfortunately, we cannot afford to break ties with our old faith."
 CBFlavorEvents.19b: "Such a wise and learned man surely deserves the title of [Root.Monarch.GetTitle]!"
