  ## Privileges
  fili_war_diviners_privilege: "War Diviners"
  fili_war_diviners_privilege_desc: "The Fili are great diviners. We shall call upon them when our soverenty is threatened."

  fili_power_of_satire_privilege: "Satire"
  fili_power_of_satire_privilege_desc: "The Fili are close to the ruler in many ways, through this they gain great, and potentially dangerous information."

  fili_councilership_privilege: "Councilership"
  fili_councilership_privilege_desc: "The words heard by the ruler are perhaps most monopolized by the Fili"

  fili_diplomacy_privilege: "Diplomacy"
  fili_diplomacy_privilege_desc: "Through their poems the Fili are most able to establish great connection between our kin."

  fili_reverence_for_poets_privilege: "Reverence for Poets"
  fili_reverence_for_poets_privilege_desc: "Poets are our history, they are our stories and our records. It is best that they be revered for all that they do."

  ## Agendas

  fili_increase_kin_opinion_agenda: "Increase opinion of kin"
  fili_increase_kin_opinion_agenda_desc: "It is important that we maintain relations with those closes to us."

