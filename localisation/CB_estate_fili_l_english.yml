  ## Decisions
  fili_divine_for_war_decision_title: "Divine for War"
  fili_divine_for_war_decision_desc: "Our enemies surround us, prepared to strike at any moment. It is only with the help of the divine sight of the fili that we shall be victorious."

  fili_commision_poem_decision_title: "Commission Poem"
  fili_commision_poem_decision_desc: "Poetry is the language of kings, and so the fili shall boast of your achievements."

  fili_commision_great_poem_decision_title: "Commission Grand Poem"
  fili_commision_great_poem_decision_desc: "Let our voice sing your deeds the loudest, let not a single soul not know of your grand deeds."

  fili_cannonise_druid_decision_title: "Cannonise Druid"
  fili_cannonise_druid_decision_desc: "We shall honour the druids who came before us, in hope that their spirit shall bless us."

