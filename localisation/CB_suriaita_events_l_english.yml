l_english:
 CBSuriaitaEvents.0t: "A Final Choice"
 CBSuriaitaEvents.0d: "With the preparations we have taken, we find ourselves at an impasse: What do we do with Cilicia?"
 CBSuriaitaEvents.0a: "Let us hope our diplomatic efforts paid off..."
 CBSuriaitaEvents.0b: "Time to see just how threatening we can be..."
 CBSuriaitaEvents.1t: "An Audience with the Patriarch"
 CBSuriaitaEvents.1d: "The Patriarch of the Syriac Church has approached the [Root.Monarch.GetTitle] of Cilicia to possibly renegotiate [SRY.Monarch.GetHerHis] terms, bringing up the possibility of conversion to their faith"
 CBSuriaitaEvents.1a: "Not once have I said you could proselytize, even less so to me!"
 CBSuriaitaEvents.1b: "I humble myself before the holy father."
 CBSuriaitaEvents.2t: "Cilician [CLC.Monarch.GetTitle] Refuses Conversion!"
 CBSuriaitaEvents.2d: "The Cilician [CLC.Monarch.GetTitle] has refused our offer of conversion!"
 CBSuriaitaEvents.2a: "Then war it is!"
 CBSuriaitaEvents.3t: "Cilician [CLC.Monarch.GetTitle] Accepts Conversion!"
 CBSuriaitaEvents.3d: "The Cilician [CLC.Monarch.GetTitle] has agreed to our offer of conversion!"
 CBSuriaitaEvents.3a: "What a joyous day!"
 CBSuriaitaEvents.4t: "Patriarchal Envoy Threatens the [Root.Monarch.GetTitle]"
 CBSuriaitaEvents.4d: "A caravan from the Syriac Patriarch has approached the throne, threatening war if [CLC.Monarch.GetTitle] [CLC.Monarch.GetName] does not bow to him!"
 CBSuriaitaEvents.4a: "You think you can threaten ME?!"
 CBSuriaitaEvents.4b: "I suppose we haven't much choice..."
 CBSuriaitaEvents.5t: "Cilician [CLC.Monarch.GetTitle] Refuses Our Ultimatum!"
 CBSuriaitaEvents.5d: "The Cilician [CLC.Monarch.GetTitle] has ignored our threats!"
 CBSuriaitaEvents.5a: "Then war it is!"
 CBSuriaitaEvents.6t: "Cilician [CLC.Monarch.GetTitle] Accepts Our Ultimatum!"
 CBSuriaitaEvents.6d: "The Cilician [CLC.Monarch.GetTitle] has subsided to our threats!"
 CBSuriaitaEvents.6a: "What a joyous day!"
 CBSuriaitaEvents.7t: "Syriac Patriarch Offers Communion"
 CBSuriaitaEvents.7d: "Yes!"
 CBSuriaitaEvents.7a: "No!"
